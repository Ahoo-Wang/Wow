# The benchmark's V10 server in its production topology (decision D224): the log and the snapshots on MongoDB (the
# `mongo` profile) or PostgreSQL (the `postgres` profile), the account's state stream published to Kafka, a cluster's
# commands routed between its nodes over their internal ports, the V10 defaults otherwise. The harness
# (test/benchmarks/harness/bench.sh) overrides the addresses, the ports and, per node of a cluster, the node id on
# the command line.
spring:
  application:
    name: transfer-service
  main:
    banner-mode: off
server:
  port: 8080
logging:
  level:
    root: warn
    me.ahoo.wow: warn
    org.springframework.boot.reactor.netty: info
    me.ahoo.wow.spring.boot.InternalServer: info
wow:
  service: transfer-service
  internal:
    port: 9090
    # The nodes of the benchmark's cluster share this machine; a deployment binds an address the nodes reach.
    host: 127.0.0.1
  kafka:
    bootstrap-servers: localhost:9092
---
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  backend: mongo
  mongo:
    database: transfer
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/transfer
    username: postgres
    password: postgres
wow:
  backend: postgres
