# The collector the services' values name (otel-collector:4318): it takes the agents' OTLP and serves the meters to
# Prometheus (prometheus.yaml) on :8889, each series labelled with its resource's attributes (service.name,
# k8s.pod.name, ...), so an alert names the pod. Spans are taken and dropped: the drill judges meters, not traces. The
# services' logs are written to the collector's own output, one OTLP JSON line per batch naming each record's pod, so
# the logs of a pod a fault deletes are still in the collector's log, which drill.sh keeps for every step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      # First in every pipeline: under the upgrade's peak (the new pods' series beside the old ones', every node's
      # traces) a collector without it grew to its limit and was OOM-killed. It refuses data above 80 % of the limit
      # rather than die, so the agents retry.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      nop: {}
      file/stdout:
        path: /dev/stdout
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [nop]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [file/stdout]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
      annotations:
        rc-drill/config: "3"
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: metrics
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: metrics
      port: 8889
      targetPort: metrics
