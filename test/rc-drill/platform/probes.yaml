# The boundary's vantage points, as the GA end-to-end run's (.github/ga-e2e/backends/probes.yaml): two pods the drill
# execs into, sending their requests with bash's /dev/tcp.
# - outsider: a pod of the cluster outside the platform, neither the gateway nor part of the shop. The NetworkPolicies
#   must keep it from every service's public port (it would bypass the gateway), every internal port and every store.
# - insider: labelled as the shop's own pods are (app.kubernetes.io/part-of: eshop), the positive control: it reaches
#   the internal ports, so a refusal the outsider sees is the policy's, not a broken network.
# They run the catalog's image idle, the one the drill built and loaded (DRILL_VERSION, which the drill substitutes when
# it applies this file), so the drill needs no other image.
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  labels:
    app.kubernetes.io/name: outsider
spec:
  containers:
    - name: probe
      image: wow-eshop-catalog-server:DRILL_VERSION
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: insider
  labels:
    app.kubernetes.io/name: insider
    app.kubernetes.io/part-of: eshop
spec:
  containers:
    - name: probe
      image: wow-eshop-catalog-server:DRILL_VERSION
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
