# The CoSec gateway behind the drill's ingress, as the GA end-to-end run deploys it (.github/ga-e2e/gateway/gateway.yaml),
# with its configuration as that run's (without the run's flaky upstream) and the shape of a deployment: two replicas,
# one per zone at most, a disruption budget, its JWT secret the drill's (cosec-jwt: COSEC_JWT_SECRET, never committed),
# and a NetworkPolicy that admits the ingress controller alone. It verifies each request's CoSec token, decides it with
# its documents in Redis (redis.yaml; the documents are .github/ga-e2e/gateway/documents, published by the drill before
# the gateway starts), and forwards the principal it verified in CoSec-Identity. Its pods carry
# app.kubernetes.io/component: gateway, which every service's public NetworkPolicy admits.
#
# It writes its TCP peer as the one X-Forwarded-For, never believing a client's: behind the ingress that peer is the
# ingress controller's pod, so a service's remote_ip is the ingress's address, not the client's. Believing the ingress's
# X-Forwarded-For is a setting of CoSec's (trusted proxies) that the drill leaves as the GA run has it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosec-gateway-config
data:
  # The image reads its configuration from this directory alone (spring.config.location=file:./config/).
  application.yaml: |
    # region settings
    server:
      port: 8080
      # The gateway is the edge: it never takes a client's Forwarded or X-Forwarded-For as its remote address. Spring
      # Boot defaults to the native strategy on Kubernetes, which would (run 7 recorded the claimed 203.0.113.9).
      forward-headers-strategy: none
    spring:
      data:
        redis:
          host: redis
          port: 6379
      cloud:
        gateway:
          server:
            webflux:
              # The X-Forwarded headers filter writes X-Forwarded-* only for a peer trusted-proxies matches (Spring Cloud
              # Gateway 4.1+); unset, it writes none and the service sees the gateway's own address. Every peer matches:
              # the gateway is the edge, its peer is the client (server.forward-headers-strategy: none above), and
              # for-append: false writes that peer as the one X-Forwarded-For, whatever the client sent.
              trusted-proxies: ".*"
              x-forwarded:
                for-append: false
              # Only X-Forwarded-For carries the client's address on: a Forwarded header the services would prefer over
              # it is not sent.
              forwarded:
                enabled: false
              # Connections to a service's pods idle at most 15 s: a pod that died stays in the endpoints a little
              # while, and a pooled connection to it answers a reset; shorter than that, a stale one is rare.
              httpclient:
                pool:
                  max-idle-time: 15s
              # Every route retries a request once when its connection fails (reset, refused, timed out), POST
              # included: Wow deduplicates a command by its request id, the client's Wow-Request-Id or else the
              # CoSec-Request-Id the gateway sets once per exchange, and a retry carries the same one. A response is
              # an answer and never retried (series INFORMATIONAL: no final status matches).
              default-filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET,POST,PUT,PATCH,DELETE
                    series: INFORMATIONAL
                    exceptions: java.io.IOException,java.util.concurrent.TimeoutException
              # endregion
              # region routes
              # Each service by its context prefix. A route takes the CoSec-Identity of a permitted request only when
              # it opts in (metadata cosec-identity: true) or targets lb://: these target a Kubernetes Service's URL.
              routes:
                - id: eshop-catalog
                  uri: http://eshop-catalog-service
                  predicates: [Path=/eshop-catalog/**]
                  metadata: { cosec-identity: true }
                - id: eshop-basket
                  uri: http://eshop-basket-service
                  predicates: [Path=/eshop-basket/**]
                  metadata: { cosec-identity: true }
                # endregion
                - id: eshop-ordering
                  uri: http://eshop-ordering-service
                  predicates: ["Path=/eshop-ordering/**,/wow/dataset/eshop-ordering/**"]
                  metadata: { cosec-identity: true }
                - id: eshop-inventory
                  uri: http://eshop-inventory-service
                  predicates: [Path=/eshop-inventory/**]
                  metadata: { cosec-identity: true }
                - id: eshop-payment
                  uri: http://eshop-payment-service
                  predicates: [Path=/eshop-payment/**]
                  metadata: { cosec-identity: true }
                - id: ops
                  uri: http://ops-service
                  predicates: [Path=/ops/**]
                  metadata: { cosec-identity: true }
                - id: view-store
                  uri: http://view-store-service
                  predicates: [Path=/view-store/**]
                  metadata: { cosec-identity: true }
                - id: analytics-catalog
                  uri: http://analytics-catalog-service
                  predicates: [Path=/analytics-catalog/**]
                  metadata: { cosec-identity: true }
    # region cosec
    cosec:
      audit:
        kafka:
          enabled: false
      authentication:
        login:
          enabled: false
      ip2region:
        enabled: false
      jwt:
        algorithm: hmac256
        secret: ${COSEC_JWT_SECRET}
      authorization:
        # The gateway is the edge: environment.ip is the TCP peer, never an X-Forwarded-For entry.
        remote-ip:
          max-trusted-index: 0
        snapshot:
          # Ready once the shop's tenant document is installed too, not the platform document alone.
          prewarm-tenants: ["(0)"]
      # What a service behind it reads: the identity alone (tenant, principal, app, space, roles, the token's id and
      # expiry), no token claims and no Authorization header, since no service verifies a token.
      gateway:
        identity:
          forward-authorization: false
      # endregion
    logging:
      level:
        root: info
    management:
      endpoint:
        health:
          # /actuator/health/liveness and /readiness for the probes; readiness refuses traffic until the platform
          # document and the prewarmed tenant's are installed.
          probes:
            enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosec-gateway
  labels:
    app.kubernetes.io/name: cosec-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cosec-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosec-gateway
        app.kubernetes.io/component: gateway
    spec:
      # No service environment variables: this Service would give the pod COSEC_GATEWAY_* variables, which Spring reads
      # as cosec.gateway.* keys, and CoSec refuses keys it does not read.
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cosec-gateway
      containers:
        - name: cosec-gateway
          image: ghcr.io/ahoo-wang/cosec-gateway:8.0.0-alpha.3@sha256:4517ff67496d04ced0099709809c3b9463e46a9050b1cd302f90e1cbab424296
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cosec-jwt
          env:
            # The image's start script sets -Xms2048M -Xmx2048M and 512M of direct memory; JAVA_OPTS comes after it
            # and wins, sized to the 1Gi limit below.
            - name: JAVA_OPTS
              value: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=192m -Djava.net.preferIPv4Stack=true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /opt/cosec-gateway-server/config
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: cosec-gateway-config
---
# The ingress's upstream (ingress/ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: cosec-gateway
  labels:
    app.kubernetes.io/name: cosec-gateway
spec:
  selector:
    app.kubernetes.io/name: cosec-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cosec-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cosec-gateway
---
# The gateway is reached through the ingress controller alone (its namespace, traefik), and by the drill's probes of the
# boundary (app.kubernetes.io/name: outsider), which check that only the gateway's port answers from outside the
# platform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosec-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cosec-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: outsider
      ports:
        - port: 8080
          protocol: TCP
