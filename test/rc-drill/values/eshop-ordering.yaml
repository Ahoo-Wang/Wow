# The drill's ordering, after the values its build generates and deploy/eshop-ordering/values.yaml: its clickhouse
# profile beside deploy/'s, the Sink writing the order stream to ClickHouse (platform/clickhouse/) for the sales
# dataset the analytics catalog serves (examples/eshop/README.md, "Sales"). The password is in the service's secret
# beside the MongoDB URI (WOW_CLICKHOUSE_PASSWORD, README.md, "Secrets").
config:
  SPRING_PROFILES_ACTIVE: mongo,kafka,clickhouse,cosec
  WOW_CLICKHOUSE_ENDPOINT: http://clickhouse:8123
  WOW_CLICKHOUSE_USERNAME: wow
  # The e2e's settings, not a deployment's (as .github/ga-e2e/services/): the failure ledger reaches ops within the ops
  # scenario's bound, a fault's parked entries retry before the verdict, and the grace-period scenario waits out a
  # payment grace of 120 s, not the image's 30 min.
  WOW_OPS_PUBLISH_ENABLED: "true"
  WOW_OPS_PUBLISH_INTERVAL: 5s
  WOW_SUBSCRIPTION_PARKED_INITIALBACKOFF: 20s
  ESHOP_ORDERING_PAYMENTGRACEPERIOD: 120s
