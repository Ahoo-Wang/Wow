# Multi-tenant Wow CQRS fixture: `user_service.users` aggregate with tenant-based
# resource attribution (`/tenant/{tenantId}/...` paths), plus a plain `users` tag
# endpoint that still generates a regular API client.
openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
tags:
  - name: user_service.users
    description: Users aggregate
  - name: users
    description: Plain (non-CQRS) user endpoints
paths:
  /tenant/{tenantId}/users:
    post:
      tags:
        - user_service.users
      summary: Create user
      operationId: user_service.users.create_user
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Create user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_service.users.CreateUser'
      responses:
        '200':
          $ref: '#/components/responses/wow.CommandOk'
  /tenant/{tenantId}/users/{userId}:
    put:
      tags:
        - user_service.users
      summary: Update user
      operationId: user_service.users.update_user
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Update user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_service.users.UpdateUser'
      responses:
        '200':
          $ref: '#/components/responses/wow.CommandOk'
    delete:
      tags:
        - user_service.users
      summary: Delete user
      operationId: user_service.users.default_delete_aggregate
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Delete user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_service.users.DeleteUser'
      responses:
        '200':
          $ref: '#/components/responses/wow.CommandOk'
    get:
      tags:
        - users
      summary: Get user by ID
      operationId: getUser
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_service.users.UserState'
  /tenant/{tenantId}/users/snapshot/single/state:
    post:
      tags:
        - user_service.users
      summary: Single snapshot state
      operationId: user_service.users.snapshot_state.single
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_service.users.UserState'
  /tenant/{tenantId}/users/snapshot/count:
    post:
      tags:
        - user_service.users
      summary: Count snapshot
      operationId: user_service.users.snapshot.count
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/user_service.users.CountQuery'
      responses:
        '200':
          $ref: '#/components/responses/wow.CountQuery'
components:
  responses:
    wow.CommandOk:
      description: Command executed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wow.command.CommandResult'
    wow.CountQuery:
      description: Count result
      content:
        application/json:
          schema:
            type: integer
            format: int64
  requestBodies:
    user_service.users.CountQuery:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/user_service.users.UserAggregatedCondition'
  schemas:
    user_service.users.UserState:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
    user_service.users.CreateUser:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
        name:
          type: string
    user_service.users.UpdateUser:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        status:
          type: string
    user_service.users.DeleteUser:
      type: object
      properties: {}
    user_service.users.UserAggregatedFields:
      type: string
      enum:
        - email
        - name
        - status
    user_service.users.UserAggregatedCondition:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/user_service.users.UserAggregatedFields'
        operator:
          type: string
          default: ALL
    wow.command.CommandResult:
      type: object
      properties:
        id:
          type: string
        stage:
          type: string
        aggregateId:
          type: string
