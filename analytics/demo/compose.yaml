# The analytics service on one machine, for the demo (analytics/demo/README.md): ClickHouse holding the retailer's
# wide table, MongoDB for the view store and the dataset registry, and the service itself on in-memory buses, with
# no Kafka and no Redis. Not a production layout: one instance, no authentication on the databases, a demo secret.
name: wow-analytics-demo

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    environment:
      CLICKHOUSE_PASSWORD: demo
    volumes:
      # Run once, on the first start of an empty volume: the database, the table and its two years of rows.
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse:/var/lib/clickhouse
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7.0
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 30

  analytics:
    # The distribution the image packs: build the console and `./gradlew :wow-analytics-server:installDist` first.
    build: ../wow-analytics-server
    depends_on:
      clickhouse:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      COSEC_JWT_SECRET: ${COSEC_JWT_SECRET:-wow-analytics-demo-secret-change-me-0123456789}
      SPRING_MONGODB_URI: mongodb://mongo:27017/wow_analytics_db
      SPRING_MONGODB_DATABASE: wow_analytics_db
      # One instance: its machine id is its own, and its buses are in memory.
      COSID_MACHINE_DISTRIBUTOR_TYPE: manual
      COSID_MACHINE_DISTRIBUTOR_MANUAL_MACHINE_ID: "1"
      WOW_KAFKA_ENABLED: "false"
      WOW_COMMAND_BUS_TYPE: in_memory
      WOW_EVENT_BUS_TYPE: in_memory
      WOW_EVENTSOURCING_STATE_BUS_TYPE: in_memory
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      WOW_QUERY_CLICKHOUSE_ENDPOINTS: http://clickhouse:8123
      WOW_QUERY_CLICKHOUSE_USERNAME: default
      WOW_QUERY_CLICKHOUSE_PASSWORD: demo
      WOW_QUERY_CLICKHOUSE_DATABASE: retail

volumes:
  clickhouse:
  mongo:
