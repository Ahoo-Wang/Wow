server:
  http2:
    enabled: true
  compression:
    enabled: true

management:
  endpoint:
    health:
      # Status only: the details name the backends and their addresses.
      show-details: when-authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - cosid
          - cosidGenerator
          - cosidStringGenerator
springdoc:
  show-actuator: true
  api-docs:
    version: openapi-3-1

spring:
  application:
    name: analytics-server
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  web:
    resources:
      # The console (R5c), built into the distribution's ui/ folder.
      static-locations: file:./ui/
  mongodb:
    uri: mongodb://root:root@localhost:27017/wow_analytics_db?authSource=admin&maxIdleTimeMS=60000
  data:
    redis:
      url: redis://localhost:6379

# Several instances share the machine ids through Redis.
cosid:
  machine:
    enabled: true
    distributor:
      type: redis
  generator:
    enabled: true

# CoSec verifies each request's JWT with this secret (the one the enterprise's CoSec issues tokens with) and puts its
# principal — roles, tenant and attributes — in the request. Route policies are the service's own (wow.analytics);
# CoSec's policy authorization can be turned on where its policy repositories run.
cosec:
  jwt:
    secret: ${COSEC_JWT_SECRET}
  inject:
    enabled: true
  authorization:
    enabled: false
  authentication:
    enabled: false
  audit:
    enabled: false
  ip2region:
    enabled: false
  limiter:
    enabled: false

wow:
  kafka:
    bootstrap-servers: PLAINTEXT://localhost:9092
    # Its own topics: another deployment on the same Kafka must not share them. A single instance may use the
    # in-memory buses instead: wow.kafka.enabled=false and wow.{command,event,eventsourcing.state}.bus.type=in_memory.
    topic-prefix: wow.analytics-server.
  query:
    clickhouse:
      enabled: true
      endpoints: http://localhost:8123
      username: default
      password: ''
      database: default
    abac:
      # People read data here: a principal without ABAC tags is refused instead of reading every row.
      require-principal-tags: true
  cosec:
    abac:
      # The principal's ABAC tags are its CoSec attributes prefixed abac. (abac.region = "east,north").
      enabled: true
  analytics:
    # The CoSec role that may draft, review, publish and retire datasets.
    admin-role: analytics-admin
    # The CoSec role that may write the tenant's shared views; a platform-tenant principal needs the system one to
    # write the system views. The server enforces the view store's gateway rules itself.
    shared-view-role: analytics-admin
    system-view-role: admin
    # The application the view store keeps this service's views under (CoSec-App-Id, set by the server).
    app-id: analytics
