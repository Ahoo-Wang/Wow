server:
  http2:
    enabled: true
  compression:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - cosid
          - cosidGenerator
          - cosidStringGenerator
springdoc:
  show-actuator: true

spring:
  application:
    name: compensation-service
  web:
    resources:
      static-locations: file:./ui/
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    datatype:
      datetime:
        write-durations-as-timestamps: true
        write-dates-as-timestamps: true
  mongodb:
    uri: mongodb://root:root@localhost:27017/compensation_db?authSource=admin&maxIdleTimeMS=60000

cosid:
  machine:
    enabled: true
    distributor:
      type: redis
  generator:
    enabled: true
wow:
  query:
    http:
      max-filter-nodes: 128
  kafka:
    bootstrap-servers: PLAINTEXT://localhost:58526
  # The embedded view store (wow-view-store-starter, /view-store/...). Its topics get a prefix of their own, so another
  # deployment of the view store on this Kafka cluster does not share them; the service's own topics keep wow.kafka's.
  view-store:
    kafka:
      topic-prefix: wow.compensation-service.
