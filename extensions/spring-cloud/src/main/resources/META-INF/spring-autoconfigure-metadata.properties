# The auto-configuration metadata Spring Boot reads in place of annotations: this module imports no Spring Boot type.
# Only where a Wow node runs, so an application that takes the module for its lb:// endpoints alone loads none of it.
me.ahoo.wow.spring.cloud.WowSpringCloudAutoConfiguration=
me.ahoo.wow.spring.cloud.WowSpringCloudAutoConfiguration.ConditionalOnClass=me.ahoo.wow.runtime.node.ServiceNode
