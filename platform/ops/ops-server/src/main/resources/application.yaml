spring:
  application:
    name: ops-service
  web:
    resources:
      # The console (roadmap 7.1b, platform/ops/console): the distribution's ui/ folder, or the console's own build
      # when the server runs from its project directory (`./gradlew :ops-server:run`).
      static-locations: file:./ui/, file:../console/dist/
server:
  port: 8088
# No identity provider until the `cosec` profile: every request is answered 401, unless a local run takes its callers
# from headers (wow.platform.trust-identity-headers).
cosec:
  enabled: false
wow:
  service: ops-service
  # One node, its data in memory, for trying the service out. The `postgres` profile keeps the entries on PostgreSQL
  # and serves their snapshot queries (`POST /ops/parked/snapshot/query`); the `kafka` profile connects the node to
  # the services whose ledgers it shows.
  backend: memory
  internal:
    port: 9098
  ops:
    # The operator's routes over this node's own parked entries (/wow/ops/parked): the ops saga's sends to an owning
    # context that failed park here.
    enabled: true
---
# CoSec (roadmap P.15) behind the CoSec gateway (decision D296): the gateway verifies each request's CoSec token
# (Authorization: Bearer) and forwards it; CoSec's inject mode here parses it, with no secret, and the edge reads the
# operator from it: its tenant, its id, its roles. CoSec's
# inject mode, without CoSec's own authorization of each path: what an operator may do is the service's to say
# (OpsAuthorizer), by the role ops.operator among the token's roles.
spring:
  config:
    activate:
      on-profile: cosec
cosec:
  enabled: true
  # The gateway holds CoSec's signing secret; this service neither signs nor verifies a token (decision D296).
  jwt:
    enabled: false
  inject:
    enabled: true
  authorization:
    enabled: false
  authentication:
    enabled: false
  audit:
    enabled: false
  ip2region:
    enabled: false
  limiter:
    enabled: false
# region roles
wow:
  cosec:
    # Tenant-level callers (decision D189): their scope has no owner, so they read every entry of their tenant. An
    # operator acts on the entries, a viewer reads them; the services' ledgers publish to Wow's default tenant, (0),
    # which a principal of CoSec's default tenant is in. A principal with neither role reads nothing.
    tenant-level:
      roles: ops.operator, ops.viewer
# endregion
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/wow_ops
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    # Creates the topics the service owns when they are missing, for trying it out; production validates them, the
    # default (decision D168).
    topics:
      ddl: auto
    bootstrap-servers: localhost:9092
    # Records the entries the services publish to wow.ops.commands (wow.ops.publish.enabled on each of them), which
    # has as many partitions as the context's log (wow.log.partitions, 64 by default). An operator's action goes to
    # the owning context's command topic, wow.<context>.commands.
    command-intake: true
