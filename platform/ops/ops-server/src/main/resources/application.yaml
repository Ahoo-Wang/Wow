spring:
  application:
    name: ops-service
  web:
    resources:
      # The console (roadmap 7.1b, platform/ops/console): the distribution's ui/ folder, or the console's own build
      # when the server runs from its project directory (`./gradlew :ops-server:run`).
      static-locations: file:./ui/, file:../console/dist/
server:
  port: 8088
# No identity provider until the `cosec` profile: without it, a node in a development profile (`dev`) takes its callers
# from the Wow-* identity headers any client sets; one in development by a loopback internal port alone serves no
# signed-in caller, and any other node does not start.
wow.cosec.mode: disabled
wow:
  # One node, its data in memory, for trying the service out. The `mongo` profile keeps the entries on MongoDB, the
  # `postgres` profile on PostgreSQL, and either serves their snapshot queries (`POST /ops/parked/snapshot/query`); the
  # `kafka` profile connects the node to the services whose ledgers it shows.
  internal:
    port: 9098
  http:
    ops:
      # The operator's routes over this node (/wow/ops): its own parked entries (/wow/ops/parked), where the ops saga's
      # sends to an owning context that failed park, and its subscriptions (/wow/ops/subscriptions).
      enabled: true
---
# CoSec (roadmap P.15) behind the CoSec gateway (decision D296): the gateway verifies each request's credential and
# forwards the identity it verified in CoSec-Identity, which CoSec's gateway mode here reads, with no secret, no
# documents and no Redis; the edge reads the operator from it: its tenant, its id, its roles. CoSec decides no path
# here: what an operator may do is the service's to say (OpsAuthorizer), by the role ops.operator among its roles. Only
# the gateway may reach the service, as the service believes any CoSec-Identity it receives.
spring:
  config:
    activate:
      on-profile: cosec
# region roles
wow:
  cosec:
    mode: gateway
    # The operators and viewers, tenant-level callers (their scope has no owner): an operator acts on the entries, a
    # viewer reads them, and a principal with neither role reads nothing (403 wow.auth.forbidden). An entry is its
    # tenant's, so no caller's owner restricts its reads: the roles do. The services' ledgers publish to Wow's
    # default tenant, (0), which a principal of CoSec's default tenant is in.
    tenant-level:
      roles: ops.operator, ops.viewer
# endregion
---
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the entries in a database
# of the service's own, where their snapshot queries are served too.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  mongo:
    database: wow_ops
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/wow_ops
    username: postgres
    password: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    bootstrap-servers: localhost:9092
    # Records the entries the services publish to wow.ops.commands (by themselves once this service is deployed:
    # wow.ops.publish.enabled is auto), which has as many partitions as the context's log (wow.log.partitions, 64 by
    # default). An operator's action goes to the owning context's command topic, wow.<context>.commands.
    command-intake:
      enabled: true
