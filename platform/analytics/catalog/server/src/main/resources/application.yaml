spring:
  application:
    name: analytics-catalog-service
server:
  port: 8087
# No identity provider until the `cosec` profile: every request is answered 401, unless a local run takes its callers
# from headers (wow.platform.trust-identity-headers).
cosec:
  enabled: false
management:
  endpoint:
    health:
      group:
        # Ready once the node serves the published datasets too (wow.analytics.catalog.datasets.serve).
        readiness:
          include: readinessState,wowReadiness,datasetPublications
wow:
  service: analytics-catalog-service
  # One node, its data in memory: the default, for trying the catalog out. The `postgres` profile below keeps the
  # sources on PostgreSQL and serves their snapshot queries.
  backend: memory
  query:
    memory:
      # The memory backend's snapshot queries (decision D209), so the sources are listed: for local runs, demos and
      # tests, never production.
      enabled: true
  aggregates:
    # Every source and dataset is the platform's: one catalog for the whole warehouse (decisions D116, D238 ②).
    "[analytics-catalog.source]":
      tenant: (platform)
    "[analytics-catalog.dataset]":
      tenant: (platform)
  internal:
    port: 9097
    # The cluster token of the service's nodes (decision D226): set WOW_INTERNAL_TOKEN, a secret of at least 32
    # characters, the same on every node. Without one, the node starts only in a development profile
    # (wow.internal.dev-profiles: dev, local, test, demo) or with its internal port on the loopback interface alone.
  clickhouse:
    # The warehouse the catalog reads (decision D241): set wow.clickhouse.endpoint (WOW_CLICKHOUSE_ENDPOINT), such as
    # http://localhost:8123, with its username, password and database. The catalog writes no table of its own there.
    sink:
      enabled: false
  analytics:
    catalog:
      # The warehouse connection: its name, the first part of each source's id, and its engine type (decision D251).
      connection: default
      engine: clickhouse
      # The databases whose tables and views are sources; wow.clickhouse.database when none is listed.
      databases: []
      # The warehouse accounts whose wow_catalog rows are trusted (decision D241 ③), each for the contexts its Sink
      # writes, such as `wow_sink: [ordering, payment]`. Nobody is trusted by default: no Wow table is adopted.
      trusted-writers: {}
      # How often the catalog looks for changed tables and wow_catalog rows (decision D241 ④).
      refresh-interval: 30s
      datasets:
        # The warehouse database the datasets' views are created in (decision D259): the catalog's account needs
        # CREATE DATABASE, CREATE VIEW and DROP VIEW there.
        database: wow_datasets
        # How long a retired dataset's views stay before they are dropped.
        retention: 7d
        # Whether this node serves the published datasets' queries, and how often it reads what changed.
        serve: true
        refresh-interval: 5s
        reconcile-interval: 5m
---
# CoSec (roadmap P.15): the service verifies each request's CoSec token (Authorization: Bearer, signed HMAC256 with
# cosec.jwt.secret, COSEC_JWT_SECRET) and the edge reads the caller from it: its tenant, its id, its roles
# (analytics.catalog.admin, analytics.catalog.approver, analytics.catalog.editor, analytics.catalog.viewer). CoSec's
# inject mode, without CoSec's own authorization of each path: what a caller may do is the service's to say
# (AnalyticsCatalogAuthorizer).
spring:
  config:
    activate:
      on-profile: cosec
cosec:
  enabled: true
  jwt:
    secret: ${COSEC_JWT_SECRET}
  inject:
    enabled: true
  authorization:
    enabled: false
  authentication:
    enabled: false
  audit:
    enabled: false
  ip2region:
    enabled: false
  limiter:
    enabled: false
wow:
  cosec:
    # Tenant-level callers (decision D189): their scope has no owner. The catalog's roles.
    tenant-level:
      roles: analytics.catalog.admin, analytics.catalog.approver, analytics.catalog.editor, analytics.catalog.viewer
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/wow_analytics_catalog
    username: postgres
    password: postgres
wow:
  backend: postgres
