spring:
  application:
    name: analytics-catalog-service
  web:
    resources:
      # The console (roadmap 7.2c, platform/analytics/catalog/console): the distribution's ui/ folder, or the console's
      # own build when the server runs from its project directory (`./gradlew :analytics-catalog-server:run`).
      static-locations: file:./ui/, file:../console/dist/
server:
  port: 8087
# No identity provider until the `cosec` profile: only a development node starts without it (a profile of
# wow.dev-profiles), taking its callers from the Wow-* identity headers any client sets.
cosec:
  enabled: false
management:
  endpoint:
    health:
      group:
        # Ready once the node serves the published datasets too (wow.analytics.catalog.datasets.serve).
        readiness:
          include: readinessState,wowReadiness,datasetPublications
wow:
  service: analytics-catalog-service
  # One node, its data in memory: the default, for trying the catalog out. The `mongo` profile below keeps the sources
  # on MongoDB, the `postgres` profile on PostgreSQL, and either serves their snapshot queries.
  backend: memory
  query:
    memory:
      # The memory backend's snapshot queries (decision D209), so the sources are listed: for local runs, demos and
      # tests, never production.
      enabled: true
  aggregates:
    # Every source and dataset is the platform's: one catalog for the whole warehouse (decisions D116, D238 ②).
    "[analytics-catalog.source]":
      tenant: (platform)
    "[analytics-catalog.dataset]":
      tenant: (platform)
  internal:
    port: 9097
  clickhouse:
    # The warehouse the catalog reads (decision D241): set wow.clickhouse.endpoint (WOW_CLICKHOUSE_ENDPOINT), such as
    # http://localhost:8123, with its username, password and database. The catalog writes no table of its own there.
    sink:
      enabled: false
  analytics:
    catalog:
      # The warehouse connection: its name, the first part of each source's id, and its engine type (decision D251).
      connection: default
      engine: clickhouse
      # The databases whose tables and views are sources; wow.clickhouse.database when none is listed.
      databases: []
      # The warehouse accounts whose wow_catalog rows are trusted (decision D241 ③), each for the contexts its Sink
      # writes, such as `wow_sink: [ordering, payment]`. Nobody is trusted by default: no Wow table is adopted.
      trusted-writers: {}
      # How often the catalog looks for changed tables and wow_catalog rows (decision D241 ④).
      refresh-interval: 30s
      datasets:
        # The warehouse database the datasets' views are created in (decision D259): the catalog's account needs
        # CREATE DATABASE, CREATE VIEW and DROP VIEW there.
        database: wow_datasets
        # How long a retired dataset's views stay before they are dropped.
        retention: 7d
        # Whether this node serves the published datasets' queries, and how often it reads what changed.
        serve: true
        refresh-interval: 5s
        reconcile-interval: 5m
      approval:
        # Whether a dataset reads only the sources an approver approved, and whether every publication takes an
        # approver (one computing from sensitive values or lowering a protection always does): both off by default.
        sources: false
        publications: false
---
# CoSec (roadmap P.15) behind the CoSec gateway (decision D296): the gateway verifies each request's CoSec token
# (Authorization: Bearer) and forwards it; CoSec's inject mode here parses it, with no secret, and the edge reads the
# caller from it: its tenant, its id, its roles
# (analytics.catalog.admin, analytics.catalog.approver, analytics.catalog.editor, analytics.catalog.viewer). CoSec's
# inject mode, without CoSec's own authorization of each path: what a caller may do is the service's to say
# (AnalyticsCatalogAuthorizer).
spring:
  config:
    activate:
      on-profile: cosec
cosec:
  enabled: true
  # The gateway holds CoSec's signing secret; this service neither signs nor verifies a token (decision D296).
  jwt:
    enabled: false
  inject:
    enabled: true
  authorization:
    enabled: false
  authentication:
    enabled: false
  audit:
    enabled: false
  ip2region:
    enabled: false
  limiter:
    enabled: false
wow:
  cosec:
    # Tenant-level callers (decision D189): their scope has no owner. The catalog's roles.
    tenant-level:
      roles: analytics.catalog.admin, analytics.catalog.approver, analytics.catalog.editor, analytics.catalog.viewer
---
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the sources in a database
# of the service's own, where their snapshot queries are served too.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  backend: mongo
  mongo:
    database: wow_analytics_catalog
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/wow_analytics_catalog
    username: postgres
    password: postgres
wow:
  backend: postgres
