spring:
  application:
    name: view-store-service
server:
  port: 8080
# No identity provider until the `cosec` profile: without it, a node in a development profile (`dev`) takes its callers
# from the Wow-* identity headers any client sets; one in development by a loopback internal port alone serves no
# signed-in caller, and any other node does not start.
wow.cosec.mode: "off"
wow:
  # One node, its data in memory: the default, for trying the view store out. The `mongo` profile below keeps the views
  # on MongoDB, the `postgres` profile on PostgreSQL, and either serves their snapshot queries.
  internal:
    port: 9090
  # The calling application, which every view, preference and wording is kept in, is the caller's authenticated one:
  # the edge records it as each command's request fact app_id (decision D232); no request-facts entry is needed.
---
# CoSec (roadmap P.15) behind the CoSec gateway (decision D296): the gateway verifies each request's CoSec token
# (Authorization: Bearer) and forwards it; CoSec's inject mode here parses it, with no secret, and the edge reads the
# user from it: its tenant, its id (the owner of its views),
# its roles (view-store.shared-writer, view-store.system-writer). CoSec's inject mode, without CoSec's own
# authorization of each path, so no application is authorized here (decision D236): set wow.cosec.trust-injected-app
# (WOW_COSEC_TRUSTINJECTEDAPP) behind a CoSec gateway that authorizes each request's CoSec-App-Id by the application's
# roles, and only where nothing else reaches the service, or every query is refused for want of an application. A
# service that authorizes its requests itself (cosec.authorization.enabled, with CoSec's policy and app role permission
# repositories) records the application its roles were authorized in, with no switch.
spring:
  config:
    activate:
      on-profile: cosec
wow:
  cosec:
    mode: gateway
---
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the views, preferences and
# wording in a database of the service's own, where their snapshot queries are served too.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  mongo:
    database: view_store
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/view_store
    username: postgres
    password: postgres
