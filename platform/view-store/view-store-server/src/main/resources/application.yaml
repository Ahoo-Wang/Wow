spring:
  application:
    name: view-store-service
server:
  port: 8080
wow:
  service: view-store-service
  # One node, its data in memory: the default, for trying the view store out. The `postgres` profile below keeps the
  # views on PostgreSQL and serves their snapshot queries.
  backend: memory
  query:
    memory:
      # The memory backend's snapshot queries, from the in-memory reference query backend (decision D209), so the
      # views are listed: for local runs, demos and tests, never production. The `postgres` profile has no store in
      # memory, so it does not apply there.
      enabled: true
  internal:
    port: 9090
    # The cluster token of the service's nodes (decision D226): set WOW_INTERNAL_TOKEN, a secret of at least 32
    # characters, the same on every node. Without one, the node starts only in a development profile
    # (wow.internal.dev-profiles: dev, local, test, demo) or with its internal port on the loopback interface alone.
  http:
    # The calling application, which every view, preference and wording is kept in.
    request-facts: CoSec-App-Id
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/view_store
    username: postgres
    password: postgres
wow:
  backend: postgres
