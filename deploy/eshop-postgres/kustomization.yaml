# The whole eShop on PostgreSQL instead of MongoDB: kubectl apply -k deploy/eshop-postgres, deploy/eshop with each
# service's postgres component (deploy/eshop-<service>/postgres).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eshop
components:
  - ../eshop-catalog/postgres
  - ../eshop-basket/postgres
  - ../eshop-ordering/postgres
  - ../eshop-inventory/postgres
  - ../eshop-payment/postgres
