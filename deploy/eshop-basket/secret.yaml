# The MongoDB connection string: the replica set of deploy/mongodb, each write acknowledged by a majority of its
# members (w=majority, which Wow asks for on every append). An example value: add your deployment's credentials and
# hosts, or create the secret from your own store, before applying.
apiVersion: v1
kind: Secret
metadata:
  name: eshop-basket-service-mongo
  labels:
    app.kubernetes.io/name: eshop-basket-service
type: Opaque
stringData:
  SPRING_MONGODB_URI: mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/?replicaSet=rs0&w=majority
