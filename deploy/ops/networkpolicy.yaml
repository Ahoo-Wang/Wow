# The public port: reachable from the gateway's pods alone (decisions D296, D300), in any namespace, labelled
# app.kubernetes.io/component: gateway. The gateway verifies each operator's credential and forwards who it is in
# CoSec-Identity, which the service believes as it comes, so a client that reached it around the gateway could be
# whoever it claims: where the policy is not enforced, keep the port private otherwise. Label your gateway's pods so,
# or change the selector to match them. Enforced where the cluster's network plugin enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-service-public
  labels:
    app.kubernetes.io/name: ops-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - port: http
          protocol: TCP
---
# The internal port: reachable from the platform's own pods alone, labelled app.kubernetes.io/part-of: wow-platform
# (decisions D173, D298, D300). It takes no token: a node names its service on each request (Wow-Service), and this
# policy is the boundary. The owning services reach ops through Kafka (wow.ops.commands), never through its internal
# port. Enforced where the cluster's network plugin enforces NetworkPolicy; where it is not, keep the internal port off
# every network but the platform's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-service-internal
  labels:
    app.kubernetes.io/name: ops-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: wow-platform
      ports:
        - port: internal
          protocol: TCP
