# The public HTTP port: the console (/) and the ops routes (/ops/..., /wow/...), for operators and ingresses.
apiVersion: v1
kind: Service
metadata:
  name: ops
  labels:
    app.kubernetes.io/name: ops
spec:
  selector:
    app.kubernetes.io/name: ops
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# The cluster channel and the wait signals (decisions D89, D173): a headless service that gives each node the DNS name
# it advertises, <pod>.ops-cluster.<namespace>.svc.cluster.local. It publishes the nodes that are not ready, so a node
# that is starting or draining still gets its peers' forwarded commands and signals. Never expose it outside the
# cluster: it takes no token, a node names its service on each request (Wow-Service, decision D300), and only the
# platform's own pods reach it (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ops-cluster
  labels:
    app.kubernetes.io/name: ops
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: ops
  ports:
    - name: internal
      port: 9098
      targetPort: internal
      protocol: TCP
