{{- if .Values.serviceAccount.create }}
# The nodes need no Kubernetes API: no token is mounted unless serviceAccount.automount says so.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wow-service.serviceAccountName" . }}
  labels:
    {{- include "wow-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
