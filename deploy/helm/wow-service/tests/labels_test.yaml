suite: the labels
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/service.yaml
  - templates/pdb.yaml
  - templates/networkpolicy.yaml
  - templates/servicemonitor.yaml
  - templates/podmonitor.yaml
set:
  service.name: eshop-ordering-service
  image.repository: ghcr.io/example/eshop-ordering-server
  partOf: eshop
  podLabels:
    team: analytics
  metrics.serviceMonitor.enabled: true
  metrics.podMonitor.enabled: true
# The refusals are in suites with one template that validates the values (deployment_test, monitoring_test): Helm
# renders the templates in reverse order, so here a refusal would be the ServiceMonitor's, whichever template is named.
tests:
  # Every selector is the service's name alone, and the pods carry it: each object selects the pods, a pod label of
  # the values' beside the chart's.
  - it: selects the pods by a label they carry, in every object, with a pod label of the values' beside it
    asserts:
      - template: templates/deployment.yaml
        isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/name: eshop-ordering-service
            app.kubernetes.io/part-of: eshop
            team: analytics
      - template: templates/deployment.yaml
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.topologySpreadConstraints[1].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/service.yaml
        documentIndex: 0
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/service.yaml
        documentIndex: 1
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/pdb.yaml
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/networkpolicy.yaml
        documentIndex: 0
        equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/networkpolicy.yaml
        documentIndex: 1
        equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      # The internal port admits the service's own nodes and its platform's pods.
      - template: templates/networkpolicy.yaml
        documentIndex: 1
        equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/networkpolicy.yaml
        documentIndex: 1
        equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels
          value:
            app.kubernetes.io/part-of: eshop
      - template: templates/podmonitor.yaml
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
      # The metrics Service selects the pods, and the ServiceMonitor selects that Service by labels it carries.
      - template: templates/servicemonitor.yaml
        documentIndex: 0
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: eshop-ordering-service
      - template: templates/servicemonitor.yaml
        documentIndex: 0
        isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: eshop-ordering-service
            wow.ahoo.me/metrics: "true"
      - template: templates/servicemonitor.yaml
        documentIndex: 1
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: eshop-ordering-service
            wow.ahoo.me/metrics: "true"
