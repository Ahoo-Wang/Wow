# The eShop ordering service on Wow, in plain manifests (roadmap P.4): kubectl apply -k deploy/eshop-ordering
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: eshop
    includeSelectors: false
resources:
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - networkpolicy.yaml
  - deployment.yaml
