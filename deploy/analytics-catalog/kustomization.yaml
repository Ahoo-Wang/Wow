# The analytics catalog on Wow, in plain manifests: kubectl apply -k deploy/analytics-catalog
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: wow-platform
    includeSelectors: false
resources:
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - networkpolicy.yaml
  - deployment.yaml
