# The public HTTP port: the analytics catalog's routes (/analytics-catalog/..., /wow/...), for the CoSec gateway in
# front of it (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: analytics-catalog-service
  labels:
    app.kubernetes.io/name: analytics-catalog-service
spec:
  selector:
    app.kubernetes.io/name: analytics-catalog-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# The internal port's headless service (decisions D89, D173): its name resolves to every node's address, the address
# each node advertises (its pod IP, decision D319), and other services find the nodes through it (D305). It publishes
# the nodes that are not ready, so a node that is starting or draining is still found. Never expose it outside the
# cluster: it takes no token, a node names its service on each request (Wow-Service, decision D300), and only the
# platform's own pods reach it (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: analytics-catalog-service-cluster
  labels:
    app.kubernetes.io/name: analytics-catalog-service
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: analytics-catalog-service
  ports:
    - name: internal
      port: 9097
      targetPort: internal
      protocol: TCP
