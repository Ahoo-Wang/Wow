# The analytics-catalog service's own values for the wow-service chart (deploy/helm/wow-service), on MongoDB:
# what the build does not know. Pass them after the values its build generates, so they override them:
#
#   ./gradlew :analytics-catalog-server:generateWowHelmValues
#   helm install analytics-catalog deploy/helm/wow-service \
#     -f platform/analytics/catalog/server/build/wow/helm/values.yaml -f deploy/analytics-catalog/values.yaml
#
# values-postgres.yaml after these puts the service on PostgreSQL instead.
image:
  # The released image, tagged with the chart's version (the Wow version) unless image.tag says otherwise; or one built from this repository (README.md).
  repository: ahoowang/wow-analytics-catalog-server
# The ports of the image's own configuration (application.yaml), which the chart sets on the pod.
ports:
  http: 8087
  internal: 9097
# The nodes share the partitions through leases in the service's database: no ZooKeeper, no consumer group.
replicas: 2
# The internal port admits the pods of the platform, labelled app.kubernetes.io/part-of: wow-platform.
partOf: wow-platform
config:
  # The mongo profile keeps the service's data on MongoDB, the replica set at secret.yaml's URI (deploy/mongodb), in a
  # database of its own; the cosec profile takes the
  # callers from the CoSec gateway in front of the service.
  SPRING_PROFILES_ACTIVE: mongo,cosec
  # The ClickHouse warehouse whose datasets the catalog describes and queries, the one the services' Sinks write to;
  # its password is in secret.yaml. The catalog writes no table of its own there.
  WOW_CLICKHOUSE_ENDPOINT: http://clickhouse:8123
  WOW_CLICKHOUSE_USERNAME: wow
  # Fixed once the context's log holds entries.
  WOW_LOG_PARTITIONS: "64"
  # Traces and metrics: the node's spans and Micrometer meters go through the OpenTelemetry Java agent, which the
  # OpenTelemetry Operator injects (podAnnotations, with an Instrumentation resource in the namespace). Without the
  # agent they are no-ops. It exports to the collector below over OTLP, and bridges Micrometer's global registry.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
# The database's connection: secret.yaml, an example to replace.
envFrom:
  - secretRef:
      name: analytics-catalog-service-mongo
podAnnotations:
  instrumentation.opentelemetry.io/inject-java: "true"
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1Gi
