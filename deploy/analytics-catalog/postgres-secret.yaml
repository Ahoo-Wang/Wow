# The PostgreSQL and ClickHouse credentials. Example values: replace them, or create the secret from your own store,
# before applying.
apiVersion: v1
kind: Secret
metadata:
  name: analytics-catalog-service-postgres
  labels:
    app.kubernetes.io/name: analytics-catalog-service
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  WOW_CLICKHOUSE_PASSWORD: wow
