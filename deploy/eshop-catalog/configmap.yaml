# The settings every node shares, as environment variables (Spring Boot's relaxed binding: wow.kafka.bootstrap-servers
# is WOW_KAFKA_BOOTSTRAPSERVERS). They override the application.yaml in the image, its profiles included.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-catalog-service-config
  labels:
    app.kubernetes.io/name: eshop-catalog-service
data:
  # The mongo profile keeps the service's data on MongoDB, the replica set at secret.yaml's URI (deploy/mongodb), in a
  # database of its own; the cosec profile takes the callers from the CoSec gateway in front of the service (decisions
  # D296, D301). The postgres component (postgres/) puts the service on PostgreSQL instead.
  SPRING_PROFILES_ACTIVE: mongo,cosec
  # Fixed once the context's log holds entries.
  WOW_LOG_PARTITIONS: "64"
  JAVA_OPTS: -XX:MaxRAMPercentage=75.0
