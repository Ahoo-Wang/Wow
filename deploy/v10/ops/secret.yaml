# The PostgreSQL credentials. Example values: replace them, or create the secret from your own store, before applying.
apiVersion: v1
kind: Secret
metadata:
  name: ops-postgres
  labels:
    app.kubernetes.io/name: ops
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
---
# The service's secrets. Example values: replace each before applying, or create the secret from your own store.
# - WOW_INTERNAL_TOKEN: the cluster token the nodes forward and signal with (decision D226), the same on every node, a
#   random secret of at least 32 characters (`openssl rand -base64 32`). To rotate it, give `old,new`, roll the nodes,
#   then `new,old`, roll, then `new` alone: a node sends the first and takes any.
# - COSEC_JWT_SECRET: the secret your CoSec signs its access tokens with (HMAC256, cosec.jwt.secret). The service
#   verifies each request's token with it, on its HTTP port and on its internal port; a token it does not verify is
#   no caller (401). Keep it as you keep CoSec's own.
apiVersion: v1
kind: Secret
metadata:
  name: ops-tokens
  labels:
    app.kubernetes.io/name: ops
type: Opaque
stringData:
  WOW_INTERNAL_TOKEN: replace-me-with-a-random-cluster-token-of-32-characters
  COSEC_JWT_SECRET: replace-me-with-the-secret-your-cosec-signs-its-tokens-with
