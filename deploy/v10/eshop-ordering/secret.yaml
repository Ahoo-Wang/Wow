# The PostgreSQL credentials. Example values: replace them, or create the secret from your own store, before applying.
apiVersion: v1
kind: Secret
metadata:
  name: eshop-ordering-postgres
  labels:
    app.kubernetes.io/name: eshop-ordering
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
---
# The service's secrets on its internal port. Example values: replace each with a random secret of at least 32
# characters (`openssl rand -base64 32`), or create the secret from your own store, before applying; the image's own
# defaults are for one machine and no secret.
# - WOW_INTERNAL_TOKEN: the cluster token the nodes forward and signal with (decision D226), the same on every node.
#   To rotate it, give `old,new`, roll the nodes, then `new,old`, roll, then `new` alone: a node sends the first and
#   takes any.
# - ESHOP_*_SERVICE_TOKEN: the identities of the shop's services (decisions D193, D226): this service's own, which it
#   signals the waits that crossed into it with, and those it trusts: the basket's calls, and the inventory's and the
#   payment's signals. Each is the same as that service's variable of the same name.
apiVersion: v1
kind: Secret
metadata:
  name: eshop-ordering-tokens
  labels:
    app.kubernetes.io/name: eshop-ordering
type: Opaque
stringData:
  WOW_INTERNAL_TOKEN: replace-me-with-a-random-cluster-token-of-32-characters
  ESHOP_ORDERING_SERVICE_TOKEN: replace-me-with-the-ordering-service-token-of-32-characters
  ESHOP_BASKET_SERVICE_TOKEN: replace-me-with-the-basket-service-token-of-32-characters
  ESHOP_INVENTORY_SERVICE_TOKEN: replace-me-with-the-inventory-service-token-of-32-characters
  ESHOP_PAYMENT_SERVICE_TOKEN: replace-me-with-the-payment-service-token-of-32-characters
