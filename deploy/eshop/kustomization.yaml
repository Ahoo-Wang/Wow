# The whole eShop, its five services, on MongoDB (deploy/mongodb) and Kafka: kubectl apply -k deploy/eshop. On
# PostgreSQL instead: kubectl apply -k deploy/eshop-postgres.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eshop-catalog
  - ../eshop-basket
  - ../eshop-ordering
  - ../eshop-inventory
  - ../eshop-payment
