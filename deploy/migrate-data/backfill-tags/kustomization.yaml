# migrate-data backfill-tags, the tags of the imported streams: kubectl create -k deploy/migrate-data/backfill-tags
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../job
nameSuffix: -backfill-tags
patches:
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["backfill-tags", "--config", "/config/migrate-data.json"]
