# The secrets the configuration reads as env:NAME: the 9.x MongoDB's connection string and the V10 target's password.
# Example values: create the secret from your own store before applying, and keep the passwords out of
# migrate-data.json. No name starts with WOW_, which a Wow service reads as its configuration.
apiVersion: v1
kind: Secret
metadata:
  name: migrate-data
type: Opaque
stringData:
  NINEX_MONGO_URI: mongodb://mongodb-9x:27017
  TARGET_PG_PASSWORD: change-me
