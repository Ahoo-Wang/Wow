# Decision D173: only the service's own nodes reach the internal port. The HTTP port takes only the CoSec gateway's
# pods, in any namespace, labelled app.kubernetes.io/component: cosec-gateway: the service trusts the application the
# gateway authorized (WOW_COSEC_TRUST_INJECTED_APP, configmap.yaml), so a client that reached it around the gateway
# could name any application. Label your gateway's pods so, or change the selector to match them. Enforced where the
# cluster's network plugin enforces NetworkPolicy; where it is not, do not trust the injected application.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: view-store
  labels:
    app.kubernetes.io/name: view-store
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: view-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: cosec-gateway
      ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: view-store
      ports:
        - port: internal
          protocol: TCP
