packages:
  - typescript/*
  - compensation/dashboard
  - documentation

allowBuilds:
  esbuild: true

# Peer ranges of the published packages, referenced with `catalog:peers`. They
# are a published contract, not the versions the workspace develops against:
# Renovate only widens them (renovate.json), so no release raises a lower bound
# unnoticed. Development and tests use the default catalog below.
catalogs:
  peers:
    '@ahoo-wang/fetcher': '^5.1.5'
    '@ahoo-wang/fetcher-decorator': '^5.1.5'
    '@ahoo-wang/fetcher-eventstream': '^5.1.5'
    react: ^19.3.0
    react-dom: ^19.3.0

# One version per external dependency across the workspace. Packages reference
# these with `catalog:`; internal packages use the `workspace:` protocol.
