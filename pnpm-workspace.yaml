packages:
  - typescript/*
  - compensation/dashboard
  - documentation

allowBuilds:
  esbuild: true

# jsdom resolves an inherited custom property that no ancestor sets by walking
# every ancestor again from each one, O(2^depth): a chart reading its theme
# tokens 20 elements deep costs seconds per test. Upstream: jsdom/jsdom#4330,
# fix in jsdom/jsdom#4371. Drop the patch once a release carries the fix; pnpm
# refuses to install while it no longer applies, so a jsdom upgrade revisits it.
patchedDependencies:
  jsdom@29.1.1: patches/jsdom@29.1.1.patch

# Peer ranges of the published packages, referenced with `catalog:peers`. They
# are a published contract, not the versions the workspace develops against:
# Renovate only widens them (renovate.json), so no release raises a lower bound
# unnoticed. Development and tests use the default catalog below.
catalogs:
  peers:
    # Development and tests run on fetcher 6 (the default catalog below);
    # typescript.yml's fetcher-floor job pins the floor of this range
    # (.github/scripts/fetcher-floor.mjs) and runs the tests and the package
    # check on it.
    '@ahoo-wang/fetcher': '^5.1.5 || ^6.0.0'
    '@ahoo-wang/fetcher-decorator': '^5.1.5 || ^6.0.0'
    '@ahoo-wang/fetcher-eventstream': '^5.1.5 || ^6.0.0'
    # Optional: only the view engine's /testing entry loads it (D65).
    mingo: ^7.2.4
    react: ^19.0.0
    react-dom: ^19.0.0
    # Optional: only the view engine's /react-router entry loads it (host-integration.md 4.2).
    react-router: ^7.0.0 || ^8.0.0

