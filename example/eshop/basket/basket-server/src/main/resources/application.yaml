spring:
  application:
    name: eshop-basket-service
server:
  port: 8082
wow:
  service: eshop-basket-service
  # One node, its data in memory, for trying the service out. The `mongo` profile serves it from MongoDB, the `postgres`
  # profile from PostgreSQL; the `kafka` profile publishes the basket stream.
  backend: memory
  internal:
    port: 9092
# CoSec runs behind the CoSec gateway alone (the `cosec` profile below); without it, a node in a development profile
# (`dev`, which `./gradlew run` adds) takes its callers from the Wow-* identity headers (the host's development callers),
# one in development by its loopback internal port alone serves every request as the anonymous caller, and any other
# node does not start (decision D301).
cosec:
  enabled: false
---
# On this machine alone, for trying the shop out, where Spring Boot detects no cloud platform: the internal port binds
# the loopback interface. On Kubernetes this document does not apply, and a deployment binds the pod's address
# (WOW_INTERNAL_HOST). The checkout reaches the ordering's internal port here; a deployment finds the ordering's nodes
# by DNS instead (decision D305).
spring:
  config:
    activate:
      on-cloud-platform: none
wow:
  internal:
    host: 127.0.0.1
  # region calls
  # The checkout saga submits the order to the ordering service synchronously, through its command
  # gateway on its internal port (wow.internal.port there; its public port refuses a call), naming this service
  # (Wow-Service), which the ordering service lists the commands of (wow.callers there).
  peers:
    eshop-ordering:
      url: http://127.0.0.1:9093
  # endregion
---
# region mongo
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the service's data in a
# database of its own.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  backend: mongo
  mongo:
    database: eshop_basket
# endregion
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_basket
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    bootstrap-servers: localhost:9092
---
# region cosec
# Behind the CoSec gateway (decisions D295, D296): the gateway verifies each request's CoSec token (Authorization:
# Bearer) and forwards it; CoSec's inject mode here reads the principal from it, with no secret, and wow-cosec's
# resolver makes it the caller (decision D301): its tenant, its id, its roles. Only the gateway may reach the public
# port (the deployment's NetworkPolicy). CoSec does not authorize the paths itself: what a caller may do is the
# service's to say.
spring:
  config:
    activate:
      on-profile: cosec
cosec:
  enabled: true
  # The gateway holds CoSec's signing secret; this service neither signs nor verifies a token.
  jwt:
    enabled: false
  inject:
    enabled: true
  authorization:
    enabled: false
  authentication:
    enabled: false
  audit:
    enabled: false
  ip2region:
    enabled: false
  limiter:
    enabled: false
wow:
  cosec:
    # An employee is a tenant-level caller (decision D189): no owner, so it reaches every aggregate of the tenant. Any
    # other principal is a buyer, an owner-level caller that reaches its own.
    tenant-level:
      roles: employee
# endregion
