spring:
  application:
    name: eshop-basket-service
server:
  port: 8082
wow:
  service: eshop-basket-service
  # One node, its data in memory, for trying the service out. The `postgres` profile serves it from PostgreSQL; the
  # `kafka` profile publishes the basket stream.
  backend: memory
  internal:
    port: 9092
  # region calls
  # The checkout saga submits the order to the ordering service synchronously (decision D193), through its command
  # gateway on its internal port (wow.internal.port there; its public port refuses a call), naming this service
  # (Wow-Service, decision D300), which the ordering service lists the commands of (wow.http.services there).
  calls:
    contexts:
      eshop-ordering:
        url: http://127.0.0.1:9093
  # endregion
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_basket
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    # Creates the topics the service owns when they are missing, for trying it out; production validates them, the
    # default (decision D168).
    topics:
      ddl: auto
    bootstrap-servers: localhost:9092
