spring:
  application:
    name: eshop-basket-service
server:
  port: 8082
wow:
  service: eshop-basket-service
  # One node, its data in memory, for trying the service out. The `postgres` profile serves it from PostgreSQL; the
  # `kafka` profile publishes the basket stream.
  backend: memory
  internal:
    port: 9092
  # The checkout saga submits the order to the ordering service synchronously (decision D193), through its command
  # gateway on its public port, with this service's credential, which the ordering service trusts
  # (wow.http.services.eshop-basket-service.tokens there). The token below is for trying the shop out on one machine:
  # a deployment sets ESHOP_SERVICE_TOKEN, a secret of at least 32 characters, and rotates it there and here.
  calls:
    contexts:
      eshop-ordering:
        url: http://localhost:8083
    token: ${ESHOP_SERVICE_TOKEN:eshop-local-service-token-not-a-secret}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_basket
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    # Creates the topics the service owns when they are missing, for trying it out; production validates them, the
    # default (decision D168).
    topics:
      ddl: auto
    bootstrap-servers: localhost:9092
