spring:
  application:
    name: eshop-payment-service
server:
  port: 8085
wow:
  service: eshop-payment-service
  # One node, its data in memory, for trying the service out. The `postgres` profile serves it from PostgreSQL; the
  # `kafka` profile connects it to the other contexts, which the node needs to start: its sagas send the ordering's
  # commands.
  backend: memory
  internal:
    port: 9095
eshop:
  payment:
    gateway:
      # The simulated gateway approves a payment up to this amount and declines one above it.
      limit: 1000.00
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_payment
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    # Creates the topics the service owns when they are missing, for trying it out; production validates them, the
    # default (decision D168).
    topics:
      ddl: auto
    bootstrap-servers: localhost:9092
