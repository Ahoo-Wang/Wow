spring:
  application:
    name: eshop-catalog-service
server:
  port: 8081
wow:
  service: eshop-catalog-service
  # One node, its data in memory: the default, for trying the catalog out. The memory backend serves no snapshot
  # queries; the `postgres` profile below serves the catalog, and its queries, from PostgreSQL.
  backend: memory
  internal:
    port: 9091
    # The cluster token this service's nodes share (decision D226): it alone opens their forwards and the signals of
    # their waits. The value is for trying the shop out on one machine; a deployment sets WOW_INTERNAL_TOKEN, a secret
    # of at least 32 characters, the same on every node of the service.
    token: ${WOW_INTERNAL_TOKEN:eshop-catalog-local-cluster-token-not-a-secret}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_catalog
    username: postgres
    password: postgres
wow:
  backend: postgres
