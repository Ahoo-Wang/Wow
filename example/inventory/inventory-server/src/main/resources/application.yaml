spring:
  application:
    name: inventory-service
server:
  port: 8081
wow:
  service: inventory-service
  # One node, its data in memory: the default, for trying it out. The `postgres` profile below serves it from
  # PostgreSQL, on as many nodes as share the database.
  backend: memory
  internal:
    port: 9091
  kafka:
    # Creates the topics the service owns when they are missing, for trying it out; production validates them, the
    # default (decision D168).
    topics:
      ddl: auto
    bootstrap-servers: localhost:9092
    # Execute the commands other contexts send to wow.inventory.commands, which has as many partitions as the
    # context's log (wow.log.partitions, 64 by default).
    command-intake: true
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: postgres
    password: postgres
wow:
  backend: postgres
