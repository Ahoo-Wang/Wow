spring:
  application:
    name: inventory-service
server:
  port: 8081
wow:
  service: inventory-service
  # One node, its data in memory: the default, for trying it out. The `postgres` profile below serves it from
  # PostgreSQL, on as many nodes as share the database.
  backend: memory
  internal:
    port: 9091
  kafka:
    bootstrap-servers: localhost:9092
    # Execute the commands other contexts send to wow.inventory.commands, which must have as many partitions as the
    # context's log (wow.log.partitions, 64 by default).
    command-intake: true
  subscriptions:
    # The saga on the shop's orders starts at the beginning of the order stream the first time it reads a partition,
    # so no order shipped or cancelled before the inventory first started is missed.
    "[OrderStockSaga.onOrderShipped]":
      start: beginning
    "[OrderStockSaga.onOrderCancelled]":
      start: beginning
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: postgres
    password: postgres
wow:
  backend: postgres
