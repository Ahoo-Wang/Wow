spring:
  application:
    name: shop-service
server:
  port: 8080
wow:
  service: shop-service
  # One node, its data in memory: the default, for trying the shop out. The `postgres` profile below serves it from
  # PostgreSQL, on as many nodes as share the database.
  backend: memory
  internal:
    port: 9090
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/shop
    username: postgres
    password: postgres
wow:
  backend: postgres
---
spring:
  config:
    activate:
      on-profile: kafka
wow:
  kafka:
    # The order stream is published to wow.example.order.state; the order saga sends the inventory's commands to
    # wow.inventory.commands and reads the receipts of those it rejects from wow.example.receipts.
    bootstrap-servers: localhost:9092
---
spring:
  config:
    activate:
      on-profile: clickhouse
wow:
  clickhouse:
    # The order stream is written to ClickHouse by the Sink (example_order_state_flat, ...), and the datasets of the
    # dataset files, META-INF/wow/dataset/example.orders.json, are queried there: /wow/dataset/example/orders/query.
    endpoint: http://localhost:8123
