comments:
  DeprecatedBlockTag:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true
complexity:
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false
style:
  ForbiddenImport:
    active: true
    # The event-stream record layout belongs to the event stores and the event-stream query backends. The snapshot,
    # schema and aggregation query code reaches the store's layout through its own store, not through these names.
    includes:
      - '**/src/main/kotlin/me/ahoo/wow/mongo/query/**'
      - '**/src/main/kotlin/me/ahoo/wow/elasticsearch/query/**'
    excludes:
      - '**/src/main/kotlin/me/ahoo/wow/mongo/query/event/**'
      - '**/src/main/kotlin/me/ahoo/wow/elasticsearch/query/event/**'
    imports:
      - value: 'me.ahoo.wow.serialization.MessageRecords*'
        reason: 'Only the event-stream query backends may name event-stream record fields; ask the store for its layout.'
      - value: 'me.ahoo.wow.serialization.event.*'
        reason: 'Only the event-stream query backends may name event-stream record fields; ask the store for its layout.'
  ForbiddenComment:
    comments:
      - reason: 'FIXME comments are not actionable; fix the issue or track it externally.'
        value: 'FIXME'
      - reason: 'HACK comments hide design debt; explain the constraint or reference an issue.'
        value: 'HACK'
      - reason: 'STOPSHIP markers must be resolved before code is committed.'
        value: 'STOPSHIP'
      - reason: 'TODO comments belong in the issue tracker, not in source code.'
        value: 'TODO'
    allowedPatterns: ''
  MaxLineLength:
    maxLineLength: 300
  ReturnCount:
    active: false
  UseCheckOrError:
    active: false
  UnusedPrivateMember:
    active: true
  ProtectedMemberInFinalClass:
    active: false
  MagicNumber:
    active: false
  UnnecessaryAbstractClass:
    # Needs type resolution (detektMain), which the `detekt` task does not run; wow-query, wow-mongo and
    # wow-elasticsearch enforce it with wow-tck's UnnecessaryAbstractClassGuardrail in their tests.
    active: true
  LoopWithTooManyJumpStatements:
    active: false
  WildcardImport:
    excludeImports:
      - java.util.*
      - org.assertj.core.api.Assertions.*
naming:
  MemberNameEqualsClassName:
    active: false
  MatchingDeclarationName:
    active: false
exceptions:
  SwallowedException:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: false
performance:
  SpreadOperator:
    active: false
formatting:
  NoWildcardImports:
    packagesToUseImportOnDemandProperty: "java.util.*,org.assertj.core.api.Assertions.*"
  MaximumLineLength:
    active: false
  Filename:
    active: false
