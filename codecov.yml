# The JVM reports aggregate JaCoCo data that Gradle's build cache restores for
# every module a change leaves alone, so the report's first <sessioninfo> can
# date from the last run that touched that module. Codecov rejects a JaCoCo
# report whose first session is older than max_report_age (12h by default) as
# an upload in `error`, and the flag falls back to carried-forward data. The
# cache is keyed on the inputs, so a restored session is still this commit's
# coverage: never expire it.
codecov:
  max_report_age: off
# Files whose code JaCoCo cannot attribute to the tests that run it (Codecov ignores whole files, not lines).
ignore:
  # inline helper: JaCoCo cannot attribute inline bodies; DdlTest covers every mode
  - core/spi/src/main/kotlin/me/ahoo/wow/spi/Ddl.kt
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    # Changed and new main code must be covered by the tests that run on the pull request.
    # `flags` names every flag (the TypeScript uploads all carry `typescript`; no flag has paths, so nothing is
    # filtered out); it is there so these statuses, like the components', wait for the flags' after_n_builds (which
    # carried-forward sessions satisfy, see flag_management below).
    patch:
      default:
        target: 90%
        threshold: 1%
        flags:
          - jvm-unit
          - integration
          - typescript
    project:
      default:
        target: 80%
        threshold: 1%
        flags:
          - jvm-unit
          - integration
          - typescript
# The JVM coverage (ci.yml): the `jvm-unit` flag is the check shards' reports (every module's unit tests), the
# `integration` flag the integration shards' (their container-backed tests). The reports name each source file by
# its repository path (test/code-coverage-report).
#
# A full run uploads `jvm-unit` once per shard of ci.yml's `check` matrix (4) and `integration` once per shard of its
# `integration` matrix (4). Codecov judges a status that reads a flag
# (the components', and patch and project above) only once the flag has `after_n_builds` sessions of this commit.
# Carried-forward sessions satisfy `after_n_builds` until the flag's first real upload replaces them: a pull request
# that skips the JVM jobs carries its base's sessions forward and is judged at once, but so is a pull request whose
# TypeScript upload lands before any JVM shard's, so Codecov may post an early status judged on the base's JVM
# coverage, then post it again once the shards have uploaded (not when the result is unchanged). ci.yml's ci-gate
# takes the newest codecov/patch that Codecov started after the run's last coverage upload, and without one accepts an
# earlier one only if it passed (.github/scripts/codecov-patch.mjs). A run whose shard fails or
# uploads nothing after another has leaves those statuses unposted (not pending) for that commit. `codecov.notify.after_n_builds` and `comment.after_n_builds` would count every session
# of the commit, the TypeScript packages' and the carried-forward ones included, so they are left unset. The
# jvm-unit and integration flags' after_n_builds are the numbers of shards of ci.yml's `check` and `integration`
# matrices (.github/scripts/integration-shards.mjs checks both).
#
# No flag has `paths`: a status filters the files by its own paths and its flags' together, so a flag's paths
# would widen every component's to the whole flag (each component then reported the same number).
#
# The unit flag is `jvm-unit`, not `unit`: Codecov keeps a `unit` flag of this repository from 2021 that it no
# longer counts among the repository's flags, so a component's `unit` regex matched nothing and every component
# read the integration shards alone (`kernel`, with no container tests, had "no coverage on head"). The retired
# flags (9.x's `local`, `contract`, `full`, and `v10`, which CI-2 split into these two) upload no more; they are not
# carried forward, so their last sessions leave the reports instead of riding along on every commit.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: jvm-unit
      after_n_builds: 4
    - name: integration
      after_n_builds: 4
    - name: v10
      carryforward: false
    - name: local
      carryforward: false
    - name: contract
      carryforward: false
    - name: full
      carryforward: false
# One Codecov component per module and per TypeScript package, so a drop in
# one module or package isn't hidden by the others. Each component gets its own
# project status against its own previous coverage. Each TypeScript package also
# uploads under its own `typescript-<package>` flag, so a pull request that tests
# only some packages carries the others' coverage forward. The examples have no
# component.
component_management:
  default_rules:
    # The JVM flags; TypeScript components set their own flags below.
    flag_regexes:
      - "^(jvm-unit|integration)$"
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    # The modules (documentation/designs/06-modules.md §4), named after their Gradle projects; none collides
    # with a TypeScript package's (wow-*). They read the `jvm-unit` and `integration` flags, so a module's coverage
    # counts its unit and container tests.
    - component_id: api
      name: api
      paths:
        - api/api/src/main/**
    - component_id: manifest
      name: manifest
      paths:
        - api/manifest/src/main/**
    - component_id: query-api
      name: query-api
      paths:
        - api/query-api/src/main/**
