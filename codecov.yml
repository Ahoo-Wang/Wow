# The JVM reports aggregate JaCoCo data that Gradle's build cache restores for
# every module a change leaves alone, so the report's first <sessioninfo> can
# date from the last run that touched that module. Codecov rejects a JaCoCo
# report whose first session is older than max_report_age (12h by default) as
# an upload in `error`, and the flag falls back to carried-forward data. The
# cache is keyed on the inputs, so a restored session is still this commit's
# coverage: never expire it.
codecov:
  max_report_age: off
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    # Changed and new main code must be covered by the tests that run on the pull request.
    # `flags` names every flag (the TypeScript uploads all carry `typescript`, which has no paths, so nothing is
    # filtered out); it is there so these statuses, like the components', wait for the `v10` flag's after_n_builds.
    patch:
      default:
        target: 90%
        threshold: 1%
        flags:
          - v10
          - typescript
    project:
      default:
        target: 80%
        threshold: 1%
        flags:
          - v10
          - typescript
# The JVM coverage is the `v10` flag (v10.yml): the V10 modules, their tests and
# the examples. The JVM reports name each source file by its repository path
# (test/code-coverage-report). The 9.x flags (`local`, `contract`,
# `integration`, `full`) left with the 9.x code (decision D262).
#
# A full v10.yml run uploads the `v10` flag 5 times: the check and the 4 integration shards. Codecov judges a status
# that reads a flag (the components', and patch and project above) only once that flag has `after_n_builds` uploads
# of this commit, so a status is never judged on the check's coverage alone. A flag's real upload replaces the
# carried-forward ones, which therefore count only until the first upload: a pull request that skips the JVM jobs
# carries the 5 sessions of its base forward and is judged at once, and a run whose shard fails or uploads nothing
# leaves those statuses unposted (not pending) for that commit. `codecov.notify.after_n_builds` and
# `comment.after_n_builds` would count every session of the commit, the TypeScript packages' and the carried-forward
# ones included, so no number there means "every v10 upload arrived"; they are left unset. Keep after_n_builds equal
# to 1 + the shards of v10.yml's `integration` matrix.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: v10
      after_n_builds: 5
      paths:
        - api/**
        - core/**
        - compiler/**
        - query/**
        - backends/**
        - edge/**
        - host/**
        - migration/**
        - platform/**
        - extensions/**
        - example/eshop/**
        - example/quickstart/**
        - example/java-smoke/**
        - test/architecture/**
        - test/routing-spike/**
        - test/lease-spike/**
        - test/test-dsl/**
        - test/tck/**
        - test/tck-containers/**
# One Codecov component per V10 module and per TypeScript package, so a drop in
# one module or package isn't hidden by the others. Each component gets its own
# project status against its own previous coverage. Each TypeScript package also
# uploads under its own `typescript-<package>` flag, so a pull request that tests
# only some packages carries the others' coverage forward. The examples have no
# component.
component_management:
  default_rules:
    # The JVM flag; TypeScript components set their own flags below.
    flag_regexes:
      - "^v10$"
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    # V10 modules (documentation/designs/v10/06-modules.md §4). Every V10 component is v10-<name>, so none
    # collides with a TypeScript package's (wow-view-store). They read only the `v10` flag, which v10.yml uploads
    # (unit and integration tests).
    - component_id: v10-api
      name: v10-api
      paths:
        - api/api/src/main/**
      flag_regexes:
        - "^v10$"
    - component_id: v10-manifest
      name: v10-manifest
      paths:
        - api/manifest/src/main/**
      flag_regexes:
        - "^v10$"
    - component_id: v10-query-api
