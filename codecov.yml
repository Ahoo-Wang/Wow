# The JVM reports aggregate JaCoCo data that Gradle's build cache restores for
# every module a change leaves alone, so the report's first <sessioninfo> can
# date from the last run that touched that module. Codecov rejects a JaCoCo
# report whose first session is older than max_report_age (12h by default) as
# an upload in `error`, and the flag falls back to carried-forward data. The
# cache is keyed on the inputs, so a restored session is still this commit's
# coverage: never expire it.
codecov:
  max_report_age: off
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    # Changed and new main code must be covered by the tests that run on the pull request (local tests).
    patch:
      default:
        target: 90%
        threshold: 1%
    project:
      default:
        target: 80%
        threshold: 1%
# V10 modules keep the packages and file names of 9.x ones, so a JaCoCo path
# (`<package>/<file>`) could name a file of each, and Codecov put one's lines
# on the other. The JVM reports name each source file by its repository path
# instead (test/code-coverage-report), and each JVM flag counts only its own
# directories: `v10` (v10.yml) the V10 modules, tests and example; `local`,
# `contract`, `integration` and `full` the 9.x ones. The 9.x reports of the full
# build also cover the V10 modules, which no 9.x flag counts.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: v10
      paths:
        - api/**
        - core/**
        - compiler/**
        - query/**
        - backends/**
        - edge/**
        - host/**
        - migration/**
        - example/eshop/**
        - test/architecture/**
        - test/kernel-benchmarks/**
        - test/routing-spike/**
        - test/lease-spike/**
    - name: local
      paths:
        - wow-*/**
        - compensation/**
        - view-store/**
        - dataset-registry/**
        - analytics/**
        - example/example-*/**
        - example/transfer/**
        - test/wow-*/**
    - name: contract
      paths:
        - wow-*/**
        - compensation/**
        - view-store/**
        - dataset-registry/**
        - analytics/**
        - example/example-*/**
        - example/transfer/**
        - test/wow-*/**
    - name: integration
      paths:
        - wow-*/**
        - compensation/**
        - view-store/**
        - dataset-registry/**
        - analytics/**
        - example/example-*/**
        - example/transfer/**
        - test/wow-*/**
    - name: full
      paths:
        - wow-*/**
        - compensation/**
        - view-store/**
        - dataset-registry/**
        - analytics/**
        - example/example-*/**
        - example/transfer/**
        - test/wow-*/**
ignore:
  - "test/wow-it/.*"
  - "test/wow-tck/.*"
  - "test/wow-test/.*"
  - "test/wow-mock/.*"
  - "example/example-api/.*"
  - "example/transfer/example-transfer-api/.*"
# One Codecov component per published Kotlin module and per TypeScript package,
# so a drop in one module or package isn't hidden by the others. Each component
# gets its own project status against its own previous coverage. Each TypeScript
# package also uploads under its own `typescript-<package>` flag, so a pull
# request that tests only some packages carries the others' coverage forward.
# Test kits (wow-test, wow-tck, wow-mock, wow-it) and examples are ignored above
# or have no component.
component_management:
  default_rules:
    # Only the flags a pull request uploads: a carried-forward `full` report would
    # hide a drop in one module. TypeScript components set their own flags below.
    flag_regexes:
      - "^local$"
      - "^contract$"
      - "^integration$"
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: wow-api
      name: wow-api
      paths:
        - wow-api/src/main/**
    - component_id: wow-metadata
      name: wow-metadata
      paths:
        - wow-metadata/src/main/**
    - component_id: wow-core
      name: wow-core
      paths:
        - wow-core/src/main/**
    - component_id: wow-compiler
