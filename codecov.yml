    # V10 modules (documentation/designs/v10/06-modules.md §4), incubating on the v10 branch. Their artifactIds
    # (wow-api, wow-compiler, wow-mongo) collide with 9.x components, so every V10 component is v10-<name>.
    # They read only the `v10` flag, which v10.yml uploads (unit and integration tests, `-Pwow.scope=v10`); the
    # 9.x components read only local, contract and integration. Every flag carries forward, so a V10-only pull
    # request, which uploads `v10` alone, leaves each 9.x component at its base coverage, and a 9.x-only one
    # leaves each V10 component at its own.
    - component_id: v10-api
      name: v10-api
      paths:
        - api/api/src/main/**
      flag_regexes:
        - "^v10$"
    - component_id: v10-manifest
