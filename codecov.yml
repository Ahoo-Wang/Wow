# The JVM reports aggregate JaCoCo data that Gradle's build cache restores for
# every module a change leaves alone, so the report's first <sessioninfo> can
# date from the last run that touched that module. Codecov rejects a JaCoCo
# report whose first session is older than max_report_age (12h by default) as
# an upload in `error`, and the flag falls back to carried-forward data. The
# cache is keyed on the inputs, so a restored session is still this commit's
# coverage: never expire it.
codecov:
  max_report_age: off
coverage:
  range: 60..100
  round: down
  precision: 2
  status:
    patch:
      default:
        target: 60%
        threshold: 1%
    project:
      default:
        target: 80%
        threshold: 1%
flag_management:
  default_rules:
    carryforward: true
ignore:
  - "document/.*"
  - "test/wow-it/.*"
  - "test/wow-tck/.*"
  - "test/wow-test/.*"
  - "wow-api/.*"
  - "wow-apiclient/.*"
  - "example/example-api/.*"
  - "example/transfer/example-transfer-api/.*"
# One Codecov component per TypeScript package, so a drop in one package isn't
# hidden by the others under the shared `typescript` flag. Each component gets
# its own project status against its own previous coverage. Each package also
# uploads under its own `typescript-<package>` flag, so a pull request that
# tests only some packages carries the others' coverage forward.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: wow-client
      name: wow-client
      paths:
        - typescript/wow-client/src/**
    - component_id: wow-react
      name: wow-react
      paths:
        - typescript/wow-react/src/**
    - component_id: wow-generator
      name: wow-generator
      paths:
        - typescript/wow-generator/src/**
    - component_id: wow-view-engine
      name: wow-view-engine
      paths:
        - typescript/wow-view-engine/src/**
