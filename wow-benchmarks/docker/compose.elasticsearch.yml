name: ${WOW_BENCHMARK_ELASTICSEARCH_PROJECT_NAME:-wow-benchmarks-elasticsearch}

services:
  elasticsearch:
    image: ${WOW_BENCHMARK_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.2.6}
    container_name: ${WOW_BENCHMARK_ELASTICSEARCH_CONTAINER_NAME:-wow-benchmark-elasticsearch}
    restart: unless-stopped
    ports:
      - "${WOW_BENCHMARK_ELASTICSEARCH_HOST_PORT:-9200}:9200"
    logging:
      driver: local
      options:
        max-size: ${WOW_BENCHMARK_DOCKER_LOG_MAX_SIZE:-10m}
        max-file: "${WOW_BENCHMARK_DOCKER_LOG_MAX_FILE:-2}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms${WOW_BENCHMARK_ELASTICSEARCH_HEAP_SIZE:-2g} -Xmx${WOW_BENCHMARK_ELASTICSEARCH_HEAP_SIZE:-2g}"
    tmpfs:
      - /usr/share/elasticsearch/data:rw,noexec,nosuid,size=${WOW_BENCHMARK_ELASTICSEARCH_DATA_TMPFS_SIZE:-4096m}
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow
          | grep -q '"timed_out":false'
      interval: ${WOW_BENCHMARK_ELASTICSEARCH_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${WOW_BENCHMARK_ELASTICSEARCH_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${WOW_BENCHMARK_ELASTICSEARCH_HEALTHCHECK_RETRIES:-30}
      start_period: ${WOW_BENCHMARK_ELASTICSEARCH_HEALTHCHECK_START_PERIOD:-30s}
      start_interval: ${WOW_BENCHMARK_ELASTICSEARCH_HEALTHCHECK_START_INTERVAL:-2s}
