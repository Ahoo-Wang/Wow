# The server images of a release (R.1, D205): the ops service
# (wow-ops-server), the view store service (wow-view-store-server) and the
# analytics catalog service with its data-owner console
# (wow-analytics-catalog-server). package-deploy.yml calls it once its
# gates passed; it can also be dispatched on a release tag to push the images
# again. release-plan.mjs gives the tags: a pre-release gets exactly its
# version, never `latest` and no `X.Y`; a stable release gets its version and
# `X.Y`, and `latest` when it is the latest line.
name: Docker Images Deploy
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
      line: ${{ steps.plan.outputs.line }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "Pushing the images of $REF" ;;
            *)
              echo "::error::Images are pushed from a v* release tag, not $REF."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide whether this release is the latest line.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      # gradle.properties, every package.json and the release tag agree.
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/project-version.mjs check

      - name: Plan the release
        id: plan
        env:
          REF: ${{ github.ref }}
        run: node .github/scripts/release-plan.mjs

  image-deploy:
    needs: plan
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wow-ops-server
            project: ops-server
            context: platform/ops/ops-server
            console: wow-ops-console
            service: ops service
            caveat: run it behind your gateway.
          - image: wow-view-store-server
            project: view-store-server
            context: platform/view-store/view-store-server
            console: ''
            service: view store service
            caveat: it does no authentication, run it behind your gateway.
          - image: wow-analytics-catalog-server
            project: analytics-catalog-server
            context: platform/analytics/catalog/server
            console: wow-analytics-catalog-console
            service: analytics catalog service and its data-owner console
            caveat: run it behind your gateway.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pre-release says it is one; the caveat holds for every release.
      - name: Describe the image
        id: describe
        env:
          MAJOR: ${{ needs.plan.outputs.major }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SERVICE: ${{ matrix.service }}
          CAVEAT: ${{ matrix.caveat }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            description="Wow V${MAJOR} ${SERVICE}. Pre-release, for evaluation; ${CAVEAT}"
          else
            description="Wow V${MAJOR} ${SERVICE}. ${CAVEAT^}"
          fi
          echo "description=${description}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: matrix.console != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: matrix.console != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm

      # The console the server serves from its distribution's ui/.
      - name: Build the console
        if: matrix.console != ''
        env:
          CONSOLE: ${{ matrix.console }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "${CONSOLE}..." build

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build Dist
        env:
          PROJECT: ${{ matrix.project }}
        run: ./gradlew ":${PROJECT}:installDist"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to AliyunCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ahoowang/${{ matrix.image }}
            ghcr.io/ahoo-wang/${{ matrix.image }}
            registry.cn-shanghai.aliyuncs.com/ahoo/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.line }},enable=${{ needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.description=${{ steps.describe.outputs.description }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          push: true
          # AliyunCR refuses OCI 1.1 artifact manifests (provenance attestations).
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
