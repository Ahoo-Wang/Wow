# The images of a release (R.1, D205): the ops service
# (wow-ops-server), the view store service (wow-view-store-server), the
# analytics catalog service with its data-owner console
# (wow-analytics-catalog-server) and the data migration tool
# (wow-migrate-data). package-deploy.yml calls it once its
# gates passed; it can also be dispatched on a release tag to push the images
# again. release-plan.mjs gives the tags: a pre-release gets exactly its
# version, never `latest` and no `X.Y`; a stable release gets its version,
# `X.Y` when it is the highest stable version of that line, and `latest` when
# it is the latest line, so a re-run of an older patch moves no floating tag.
# Each image is built once and pushed to GHCR, then that index is copied to
# Docker Hub and Aliyun (docker buildx imagetools create), each copy a step
# of its own with a step timeout and three attempts. image-check then reads
# all of them back (release-published.mjs --only images), dispatched runs
# included.
name: Docker Images Deploy
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
      line: ${{ steps.plan.outputs.line }}
      line-tag: ${{ steps.plan.outputs.line-tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "Pushing the images of $REF" ;;
            *)
              echo "::error::Images are pushed from a v* release tag, not $REF."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide which floating tags this release moves.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.3

      # gradle.properties, every package.json and the release tag agree.
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/project-version.mjs check

      - name: Plan the release
        id: plan
        env:
          REF: ${{ github.ref }}
        run: node .github/scripts/release-plan.mjs

  image-deploy:
    needs: plan
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wow-ops-server
            project: ops-server
            context: platform/ops/ops-server
            console: wow-ops-console
            service: ops service
            caveat: run it behind your gateway.
          - image: wow-view-store-server
            project: view-store-server
            context: platform/view-store/view-store-server
            console: ''
            service: view store service
            caveat: it does no authentication, run it behind your gateway.
          - image: wow-analytics-catalog-server
            project: analytics-catalog-server
            context: platform/analytics/catalog/server
            console: wow-analytics-catalog-console
            service: analytics catalog service and its data-owner console
            caveat: run it behind your gateway.
          - image: wow-migrate-data
            project: migrate-data
            context: migration/migrate-data
            console: ''
            service: data migration tool, migrate-data, which moves a 9.x service's data into Wow 10
            caveat: rehearse every migration on a copy of the data first.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pre-release says it is one; the caveat holds for every release.
      - name: Describe the image
        id: describe
        env:
          MAJOR: ${{ needs.plan.outputs.major }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SERVICE: ${{ matrix.service }}
          CAVEAT: ${{ matrix.caveat }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            description="Wow V${MAJOR} ${SERVICE}. Pre-release, for evaluation; ${CAVEAT}"
          else
            description="Wow V${MAJOR} ${SERVICE}. ${CAVEAT^}"
          fi
          echo "description=${description}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: matrix.console != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: matrix.console != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.3
          cache: pnpm

      # The console the server serves from its distribution's ui/.
      - name: Build the console
        if: matrix.console != ''
        env:
          CONSOLE: ${{ matrix.console }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "${CONSOLE}..." build

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build Dist
        env:
          PROJECT: ${{ matrix.project }}
        run: ./gradlew ":${PROJECT}:installDist"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to AliyunCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_CR_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ahoowang/${{ matrix.image }}
            ghcr.io/ahoo-wang/${{ matrix.image }}
            registry.cn-shanghai.aliyuncs.com/ahoo/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.line }},enable=${{ needs.plan.outputs.line-tag == 'true' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.description=${{ steps.describe.outputs.description }}

      # The tags docker/metadata-action gives each registry, apart: the build
      # pushes GHCR's, and the copies below Docker Hub's and Aliyun's.
      - name: Tags per registry
        id: tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for registry in ghcr=ghcr.io/ahoo-wang/ dockerhub=ahoowang/ aliyun=registry.cn-shanghai.aliyuncs.com/ahoo/; do
            name=${registry%%=*}
            tags=$(awk -v prefix="${registry#*=}" 'index($0, prefix) == 1' <<<"$TAGS")
            if [ -z "$tags" ]; then
              echo "::error::docker/metadata-action gave no tag for ${registry#*=}"
              exit 1
            fi
            echo "$name: $(tr '\n' ' ' <<<"$tags")"
            { echo "$name<<EOF"; echo "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"
          done

      # Built once and pushed to GHCR alone; Docker Hub and Aliyun get a copy
      # of this very index, so the three hold one digest. A push that hangs
      # ends the step, not the job.
      - name: Build and push to GHCR
        id: build
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          push: true
          # AliyunCR refuses OCI 1.1 artifact manifests (provenance attestations).
          provenance: false
          tags: ${{ steps.tags.outputs.ghcr }}
          labels: ${{ steps.meta.outputs.labels }}

      # A copy of GHCR's index, its blobs read from GHCR. Each attempt is
      # bounded so that three fit in the step (10.0.0-beta.7's push to Aliyun
      # hung until the job's limit); the three pushes of a release took under
      # a minute together.
      - name: Copy to Docker Hub
        timeout-minutes: 10
        env:
          SOURCE: ghcr.io/ahoo-wang/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.dockerhub }}
        run: |
          args=()
          while read -r tag; do args+=(--tag "$tag"); done <<<"$TAGS"
          for attempt in 1 2 3; do
            if timeout --kill-after=5s 3m docker buildx imagetools create "${args[@]}" "$SOURCE"; then
              exit 0
            fi
            echo "::warning::Copying $SOURCE to Docker Hub failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] || sleep 10
          done
          echo "::error::Docker Hub did not take $SOURCE in 3 attempts"
          exit 1

      - name: Copy to Aliyun
        timeout-minutes: 10
        env:
          SOURCE: ghcr.io/ahoo-wang/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.aliyun }}
        run: |
          args=()
          while read -r tag; do args+=(--tag "$tag"); done <<<"$TAGS"
          for attempt in 1 2 3; do
            if timeout --kill-after=5s 3m docker buildx imagetools create "${args[@]}" "$SOURCE"; then
              exit 0
            fi
            echo "::warning::Copying $SOURCE to Aliyun failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] || sleep 10
          done
          echo "::error::Aliyun did not take $SOURCE in 3 attempts"
          exit 1

  # Reads back what image-deploy pushed, anonymously, as anyone pulls it
  # (release-published.mjs --only images): every image on GHCR, Docker Hub and
  # Aliyun at the version, an index of linux/amd64 and linux/arm64 with one
  # digest on the three, and the floating tags moved only as the plan says. It
  # holds no credentials and changes nothing published: a failure here is
  # re-run alone, and re-running it publishes nothing.
  image-check:
    needs: [plan, image-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide which floating tags this release moves.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.3

      - name: Check the published images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/release-published.mjs --version "$VERSION" --only images
