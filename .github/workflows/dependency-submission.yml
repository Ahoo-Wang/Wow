# Submits the Gradle build's resolved dependencies to GitHub's dependency graph,
# so that Dependabot alerts cover what the published Maven modules pull in: the
# graph otherwise holds the npm lock file alone, and no advisory was matched
# against a JVM dependency (the round-two security review, #7021, D485). It
# submits the runtime class paths only, what a module ships with, not what its
# tests or its build use. It runs on a push to main that changes the build's
# dependencies, by hand, and on a pull request that changes this file, which is
# how a change to it is tried before it merges. It is no merge signal: ci-gate
# does not read it, and it never fails a pull request for a dependency.
name: Dependency submission
on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build-logic/**'
      - '.github/workflows/dependency-submission.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: GITHUB_ACTIONS

jobs:
  submit:
    name: Submit the Gradle dependency graph
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API takes a snapshot only with write access to contents.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The Gradle cache is written by ci.yml's pushes to main alone.
          cache-read-only: true
          # The main runtime class path alone. `.*[rR]untimeClasspath` also matched `testRuntimeClasspath` and
          # `integrationTestRuntimeClasspath`, so the first run on main reported what only tests use.
          dependency-graph-include-configurations: 'runtimeClasspath'
