# Publishes a release to GitHub Packages, Maven Central and npm. It runs for a
# GitHub release, or by hand on a v* tag ("Use workflow from" → Tags); any
# other ref is refused. Every action is pinned to a commit SHA: these jobs hold
# the signing key, the Sonatype credentials and npm's OIDC identity.
# typescript/RELEASING.md is the maintainer's checklist.
#
# release-plan.mjs decides what a tag publishes (AGENTS.md "Releasing"): the
# gates and the Maven publications cover the modules, the BOM and
# wow-dependencies, the only projects the build has (D262). A pre-release
# (`-alpha.n`, `-beta.n`, `-rc.n`) goes to npm under `alpha`/`beta`/`next`,
# never `latest` (publish-npm.mjs); image-deploy.yml pushes its server images
# under the version alone; its GitHub pre-release carries the notes of
# .github/release-notes/prerelease.md. A stable release goes to npm under
# `latest` when it is the latest line (`release-<x.y>` otherwise), its images
# also get `<x.y>` and, on the latest line, `latest`, and its GitHub release
# is marked latest on the latest line, with .github/release-notes/stable.md
# when none exists. A tag of an older major is refused: it releases from its
# maintenance branch (9.x from v9).
name: Packages Deploy
on:
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

# One release of a tag at a time; a second trigger waits, never cancels a
# publish half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      line: ${{ steps.plan.outputs.line }}
      notes: ${{ steps.plan.outputs.notes }}
    permissions:
      contents: read
      # Release admission reads the full runs of this commit and dispatches
      # the ones it lacks (dispatch events are the one kind GITHUB_TOKEN may
      # start workflows with).
      actions: write
      # The breaking-change labels of the pull requests since the previous
      # release.
      pull-requests: read
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "Releasing $REF" ;;
            *)
              echo "::error::Releases run from a v* tag, not $REF. Choose the tag under 'Use workflow from'."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Branches for the release-branch rule; tags and history for the
          # breaking-change rule.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      # A v<version> tag of the highest major; pre-release or stable, and
      # whether it is the latest line.
      - name: Plan the release
        id: plan
        env:
          REF: ${{ github.ref }}
        run: node .github/scripts/release-plan.mjs

      # gradle.properties, every package.json and the release tag agree.
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/project-version.mjs check

      # The commit is on main or release-x.y; full runs of the TypeScript,
      # contract and Storybook workflows passed on it (dispatched if missing);
      # breaking changes since the previous v* tag (a `!` title, a BREAKING
      # CHANGE footer, or a pull request labelled breaking-change) ship only
      # in x.Y.0, and the release notes of an x.Y.0 name each of them.
      - name: Admit release
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_REF: ${{ github.ref }}
        run: node .github/scripts/release-admission.mjs

  preflight:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # v* tags decide the dist-tag the dry run prints.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build:typescript

      # The tarballs npm-deploy publishes, packed once here.
      - name: Pack npm packages
        run: node .github/scripts/publish-npm.mjs --pack "$RUNNER_TEMP/npm-tarballs"

      # publint, types under node16/nodenext/bundler, and a fresh project that
      # installs, imports and requires these very tarballs and runs the bins.
      - name: Check npm packages
        run: node .github/scripts/package-check.mjs --tarballs "$RUNNER_TEMP/npm-tarballs"

      - name: Verify npm publish
        run: node .github/scripts/publish-npm.mjs --dry-run --tarballs "$RUNNER_TEMP/npm-tarballs"

      - name: Upload npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
          overwrite: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The gates on the release commit itself: compile, unit tests,
      # detekt and the ABI of the modules (:check), and their
      # container-backed tests.
      - name: Verify release build
        run: ./gradlew :check :integrationTest

      # Builds and signs every publication the deploy jobs upload, publishes
      # them into a scratch repository and checks them: jars, sources,
      # javadoc, POMs, module metadata and signatures, the BOM against the
      # published modules, and no 9.x module. Then runs the deploy jobs'
      # prebuilt publish without the key and requires the same files, every
      # signature verifying (publicationCheck).
      - name: Verify release artifacts
        run: ./gradlew -Pwow.publication.signed=true publicationCheck
        env:
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            **/build/libs/**
            **/build/publications/**
          if-no-files-found: error
          overwrite: true

  github-deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: .

      # Uploads the files the preflight built, signed and checked, with their
      # signatures: the wow.publication.prebuilt property (settings.gradle.kts)
      # leaves out every task that makes one, Sign tasks included (no key
      # here), and requires the preflight's .asc files. The preflight's
      # publicationCheck ran this publish and checked what it uploads.
      - name: Publish package
        run: |
          ./gradlew -Pwow.publication.prebuilt=true \
            publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central-deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: .

      # Uploads the files the preflight built, signed and checked, with their
      # signatures: the wow.publication.prebuilt property (settings.gradle.kts)
      # leaves out every task that makes one, Sign tasks included (no key
      # here), and requires the preflight's .asc files. The preflight's
      # publicationCheck ran this publish and checked what it uploads.
      - name: Publish package
        run: |
          ./gradlew -Pwow.publication.prebuilt=true \
            publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  # Publishes the tarballs preflight packed and checked; nothing is installed
  # or built here. It starts once both Maven publications have succeeded, so
  # a release never reaches npm without its JVM artifacts. The npm-publish
  # environment (v* tags only, no reviewer) is what npm's trusted publisher
  # is bound to.
  npm-deploy:
    needs: [preflight, github-deploy, central-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance; no npm token.
      id-token: write
    env:
      # Trusted publishing needs npm 11.5.1 or later.
      # renovate: datasource=npm depName=npm
      NPM_VERSION: 11.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide whether this release is the latest line.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      - name: Set up npm
        run: npm install --global "npm@$NPM_VERSION"

      # Outside the checkout, which must stay clean for the publish.
      - name: Download npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      # Publishes every package in PUBLISHED (publish-npm.mjs); skips versions
      # already on npm, so re-running after a partial failure is safe.
      - name: Publish to npm
        run: node .github/scripts/publish-npm.mjs --tarballs "$RUNNER_TEMP/npm-tarballs"

  # What a user gets from npm, minutes after the publish: waits (bounded) until
  # the registry serves every published package at the release version and its
  # dist-tag points at it, then installs name@version into a clean project,
  # imports every entry point (and requires those CommonJS users get),
  # resolves the view engine's style sheets, runs the bins (the generator's
  # --version, the view engine's theme-check --help) and type-checks
  # consumers. It needs no build and no secrets. A
  # failure here means the release is live and broken: follow "出错时" in
  # typescript/RELEASING.md.
  npm-smoke:
    needs: npm-deploy
    name: npm smoke / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The engines floor of the published packages, and the current LTS.
        node-version: [22.12.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide which dist-tag the release must have.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke-test the published packages
        run: node .github/scripts/package-check.mjs --registry

  # The server images, under the tags release-plan.mjs gives them, once the
  # release is on Maven Central and npm.
  images:
    needs: npm-deploy
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-deploy.yml
    secrets: inherit

  # The GitHub release of the tag: created from the plan's notes template
  # (.github/release-notes/prerelease.md or stable.md) when the run was
  # dispatched on the tag (a release created by hand started it otherwise).
  # Either way a pre-release is marked a pre-release and never the latest
  # release; a stable release is not a pre-release, and is the latest release
  # when it is the latest line.
  release-notes:
    needs: [admission, npm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or mark the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.admission.outputs.prerelease }}
          LATEST: ${{ needs.admission.outputs.latest }}
          LINE: ${{ needs.admission.outputs.line }}
          NOTES: ${{ needs.admission.outputs.notes }}
        run: |
          version="${TAG#v}"
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--prerelease=false "--latest=${LATEST}")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
          else
            sed -e "s/VERSION/${version}/g" -e "s/LINE/${LINE}/g" "$NOTES" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag "${flags[@]}" \
              --title "Wow ${version}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
