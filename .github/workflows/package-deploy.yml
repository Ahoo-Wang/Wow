# Publishes a release to GitHub Packages, Maven Central and npm. It runs for a
# GitHub release, or by hand on a v* tag ("Use workflow from" → Tags); any
# other ref is refused. Every action is pinned to a commit SHA: these jobs hold
# the signing key, the Sonatype credentials and npm's OIDC identity.
# typescript/RELEASING.md is the maintainer's checklist.
name: Packages Deploy
on:
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

# One release of a tag at a time; a second trigger waits, never cancels a
# publish half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      # Release admission reads the full runs of this commit and dispatches
      # the ones it lacks (dispatch events are the one kind GITHUB_TOKEN may
      # start workflows with).
      actions: write
    steps:
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "Releasing $REF" ;;
            *)
              echo "::error::Releases run from a v* tag, not $REF. Choose the tag under 'Use workflow from'."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Branches for the release-branch rule; tags and history for the
          # breaking-change rule.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      # gradle.properties, every package.json and the release tag agree.
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/project-version.mjs check

      # The commit is on main or release-x.y; full runs of the TypeScript,
      # contract and Storybook workflows passed on it (dispatched if missing);
      # breaking commits since the previous v* tag ship only in x.Y.0.
      - name: Admit release
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_REF: ${{ github.ref }}
        run: node .github/scripts/release-admission.mjs

  preflight:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # v* tags decide the dist-tag the dry run prints.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build:typescript

      # The tarballs npm-deploy publishes, packed once here.
      - name: Pack npm packages
        run: node .github/scripts/publish-npm.mjs --pack "$RUNNER_TEMP/npm-tarballs"

      # publint, types under node16/nodenext/bundler, and a fresh project that
      # installs, imports and requires these very tarballs and runs the bins.
      - name: Check npm packages
        run: node .github/scripts/package-check.mjs --tarballs "$RUNNER_TEMP/npm-tarballs"

      - name: Verify npm publish
        run: node .github/scripts/publish-npm.mjs --dry-run --tarballs "$RUNNER_TEMP/npm-tarballs"

      - name: Upload npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
          overwrite: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # Unit, contract and integration tests of the Gradle build, on the
      # release commit itself.
      - name: Verify release build
        run: ./gradlew build allIntegrationTest

      - name: Verify release artifacts
        run: ./gradlew publishToMavenLocal
        env:
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_SECRETKEY: ${{ secrets.SIGNING_SECRETKEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            **/build/libs/**
            **/build/publications/**
          if-no-files-found: error
          overwrite: true

  github-deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      - name: Publish package
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository \
            -x jar \
            -x sourcesJar \
            -x javadocJar \
            -x generatePomFileForMavenLibraryPublication \
            -x generatePomFileForMavenBomPublication \
            -x generateMetadataFileForMavenLibraryPublication \
            -x generateMetadataFileForMavenBomPublication \
            -x signMavenLibraryPublication \
            -x signMavenBomPublication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central-deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      - name: Publish package
        run: |
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository \
            -x jar \
            -x sourcesJar \
            -x javadocJar \
            -x generatePomFileForMavenLibraryPublication \
            -x generatePomFileForMavenBomPublication \
            -x generateMetadataFileForMavenLibraryPublication \
            -x generateMetadataFileForMavenBomPublication \
            -x signMavenLibraryPublication \
            -x signMavenBomPublication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  # Publishes the tarballs preflight packed and checked; nothing is installed
  # or built here. The npm-publish environment waits for a maintainer's
  # approval, and npm's trusted publisher is bound to it.
  npm-deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance; no npm token.
      id-token: write
    env:
      # Trusted publishing needs npm 11.5.1 or later.
      # renovate: datasource=npm depName=npm
      NPM_VERSION: 11.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide whether this release is the latest line.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0

      - name: Set up npm
        run: npm install --global "npm@$NPM_VERSION"

      # Outside the checkout, which must stay clean for the publish.
      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      # Publishes wow-client, wow-react and wow-generator; skips versions
      # already on npm, so re-running after a partial failure is safe.
      - name: Publish to npm
        run: node .github/scripts/publish-npm.mjs --tarballs "$RUNNER_TEMP/npm-tarballs"

  # What a user gets from npm, minutes after the publish: waits (bounded) until
  # the registry serves every published package at the release version and its
  # dist-tag points at it, then installs name@version into a clean project,
  # imports and requires every entry point, runs the generator bins with
  # --version and type-checks consumers. It needs no build and no secrets. A
  # failure here means the release is live and broken: follow "出错时" in
  # typescript/RELEASING.md.
  npm-smoke:
    needs: npm-deploy
    name: npm smoke / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The engines floor of the published packages, and the current LTS.
        node-version: [22.12.0, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All v* tags decide which dist-tag the release must have.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke-test the published packages
        run: node .github/scripts/package-check.mjs --registry
