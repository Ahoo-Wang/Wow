# The eShop's fault-injection soak (C.1), soak.yml, on main every night that
# main moved. GitHub runs a schedule from the default branch only, which main is.
name: Nightly
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch the soak on main
    if: github.repository == 'Ahoo-Wang/Wow'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Dispatch
        run: |
          committed=$(gh api "repos/$GH_REPO/commits/main" --jq .commit.committer.date)
          if [ "$FORCE" != true ] && [ "$(date -d "$committed" +%s)" -lt "$(date -d '1 day ago' +%s)" ]; then
            echo "main has not moved since $committed"
            exit 0
          fi
          gh workflow run soak.yml --ref main
