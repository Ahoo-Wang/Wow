name: Sync to Gitee
# v9, the 9.x line: a push to it mirrors the repository at once. The daily
# schedule runs from the default branch, main, whose copy of this workflow
# mirrors every branch, v9 included.
on:
  push:
    branches:
      - v9
  workflow_dispatch:
# The mirror authenticates with its own SSH key; the job needs no token.
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A third-party action holding the mirror's SSH key: pinned to a commit.
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@6bbc55f2f0082bca533b72dc711f7d37154d40cc # v1.3.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        with:
          source-repo: "git@github.com:Ahoo-Wang/Wow.git"
          destination-repo: "git@gitee.com:AhooWang/Wow.git"