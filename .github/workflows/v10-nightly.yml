# The 9.x suites on the v10 branch, every night. On v10 their paths leave out
# the V10 directories (v10.yml checks those), so a V10-only change runs none of
# them; this run catches what such a change could still break in 9.x. GitHub
# runs a schedule from the default branch only, so this file takes effect on
# main: it dispatches each workflow on v10, which runs v10's copy of it there.
# It skips a night on which v10 did not move. On the same nights it dispatches
# v10-soak.yml, the eShop's fault-injection soak (C.1), on v10.
name: V10 Nightly
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch the 9.x suites and the soak on v10
    if: github.repository == 'Ahoo-Wang/Wow'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Dispatch
        run: |
          committed=$(gh api "repos/$GH_REPO/commits/v10" --jq .commit.committer.date)
          if [ "$FORCE" != true ] && [ "$(date -d "$committed" +%s)" -lt "$(date -d '1 day ago' +%s)" ]; then
            echo "v10 has not moved since $committed"
            exit 0
          fi
          for workflow in local-test.yml integration-test.yml contract-test.yml static-analysis.yml \
            compensation-test.yml example-java-test.yml benchmark-smoke.yml v10-soak.yml; do
            gh workflow run "$workflow" --ref v10
          done
