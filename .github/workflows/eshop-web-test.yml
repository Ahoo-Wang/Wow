# The eShop's web UI (example/eshop/web, V10 work package E.7) on the v10
# branch. Every pull request to v10 triggers this workflow; the scope job
# (.github/scripts/ci-scope.mjs) turns the jobs on for a V10 path (`v10`: the
# UI, the eShop's services and the modules they run on) or a change to the
# client, the generator or the workspace (`sdk`), and `eshop-web-gate` is the
# merge signal: it passes when they pass or when the scope skipped them.
name: eShop Web Test
on:
  pull_request:
    branches: [v10]
  push:
    branches: [v10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: GITHUB_ACTIONS

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.v10 == 'true' || steps.scope.outputs.sdk == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  # Lint, types (the build's `tsc -b`), the component tests with the generated
  # clients held byte for byte against the Manifest baselines, and the build.
  test:
    name: eShop Web Test
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-eshop-web...
      - name: Build the UI and the workspace packages it uses
        run: pnpm --filter wow-eshop-web... build
      - name: Lint
        working-directory: example/eshop/web
        run: pnpm lint
      - name: Test
        working-directory: example/eshop/web
        run: pnpm coverage

  # The UI end to end: the five eShop services in one JVM in memory
  # (EshopLocal, no containers), the dev server, Chromium.
  e2e:
    name: eShop Web E2E
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the eShop services
        run: ./gradlew :eshop-e2e:eshopLocalClasspath --stacktrace
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-eshop-web...
      - name: Build the workspace packages the UI uses
        run: pnpm --filter "wow-eshop-web^..." build
      - name: Install Chromium
        working-directory: example/eshop/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Test end to end
        working-directory: example/eshop/web
        run: pnpm test:e2e
      - name: Upload the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eshop-web-e2e
          path: example/eshop/web/test-results/
          retention-days: 7

  eshop-web-gate:
    name: eshop-web-gate
    needs: [scope, test, e2e]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
