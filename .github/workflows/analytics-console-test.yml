name: Analytics Console Test
on:
  pull_request:
    paths:
      - '.github/workflows/analytics-console-test.yml'
      - 'analytics/console/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig.base.json'
      # Workspace packages the console builds against.
      - 'typescript/wow-client/**'
      - 'typescript/wow-view-engine/**'
      - 'typescript/wow-view-store/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: GITHUB_ACTIONS

jobs:
  console-test:
    name: Analytics Console Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          cache: 'pnpm'

      - name: Install Packages
        run: pnpm install --frozen-lockfile --filter wow-analytics-console...

      - name: Lint Console
        working-directory: analytics/console
        run: pnpm exec eslint .

      - name: Build Console
        run: pnpm --filter wow-analytics-console... build

      - name: Test Console
        working-directory: analytics/console
        run: pnpm coverage
