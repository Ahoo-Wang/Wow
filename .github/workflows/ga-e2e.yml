# The GA end-to-end verification (roadmap 9.3g, decision D317, work packages G.2 and G.3): the eShop, ops, the view
# store and the analytics catalog deployed on a kind cluster with Calico, so the NetworkPolicies hold, behind CoSec
# Gateway in inject mode, with the deploy/ manifests (and .github/ga-e2e/services/ for the services that have none
# yet), on PostgreSQL or a MongoDB replica set, Kafka and ClickHouse. The images are built from the commit and loaded
# into the cluster, never pushed. The runner (`:eshop-e2e:clusterTest`) drives the scenarios through the gateway and
# judges them by the soak's invariants; the report (JSON) and every pod's log are uploaded. nightly.yml dispatches it
# every night main moved; it can also be dispatched by hand.
name: GA end-to-end
on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'The arm to run: both, or one of them'
        type: choice
        options: [both, postgres, mongo]
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: GITHUB_ACTIONS

jobs:
  cluster:
    name: GA e2e on ${{ matrix.backend }}
    if: github.repository == 'Ahoo-Wang/Wow'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both arms unless the dispatch names one (nightly.yml dispatches both). The mongo arm waits for the host to
        # create the MongoDB client from the URI (D318, R5 batch 4): until then `both` runs PostgreSQL alone, and
        # `mongo` runs the arm on its own, to try it.
        backend: ${{ fromJSON(inputs.backend == 'mongo' && '["mongo"]' || '["postgres"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      # The servers' distributions, as image-deploy.yml builds them (without the consoles, which no scenario opens),
      # and the runner.
      - name: Build the distributions and the runner
        run: |
          ./gradlew --stacktrace \
            :eshop-catalog-server:installDist :eshop-basket-server:installDist :eshop-ordering-server:installDist \
            :eshop-inventory-server:installDist :eshop-payment-server:installDist \
            :ops-server:installDist :view-store-server:installDist :analytics-catalog-server:installDist \
            :eshop-e2e:clusterTestClasses
      - name: Build the images
        run: .github/ga-e2e/cluster.sh images
      # No CNI yet (kind.yaml): the control plane is not ready until Calico runs, so the action does not wait for it.
      - name: Create the kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: wow-ga-e2e
          config: .github/ga-e2e/kind.yaml
          wait: 0s
      - name: Install Calico and load the images
        run: .github/ga-e2e/cluster.sh network
      - name: Deploy the backends and the gateway
        env:
          BACKEND: ${{ matrix.backend }}
        run: .github/ga-e2e/cluster.sh backends "$BACKEND"
      - name: Deploy the services
        env:
          BACKEND: ${{ matrix.backend }}
        run: .github/ga-e2e/cluster.sh services "$BACKEND"
      # The scenarios and the verdict; the test fails on a violated invariant or bound, and never retries.
      - name: Run the scenarios
        env:
          BACKEND: ${{ matrix.backend }}
        run: ./gradlew :eshop-e2e:clusterTest -Pga.backend="$BACKEND" --stacktrace
      - name: Collect the cluster's diagnostics
        if: always()
        run: .github/ga-e2e/cluster.sh diagnostics example/eshop/e2e/build/ga-e2e/cluster
      - name: Summarize the report
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          report=example/eshop/e2e/build/ga-e2e/report.json
          summary=example/eshop/e2e/build/ga-e2e/summary.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$report" ]; then
            echo "### GA e2e on $BACKEND: $(jq -r .verdict "$report")" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### GA e2e on $BACKEND: no report"
              echo
              echo "The runner wrote none: the cluster or a service did not come up. See the failed step and the"
              echo "diagnostics artifact (pods, events, every pod's log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report and the diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ga-e2e-${{ matrix.backend }}
          path: example/eshop/e2e/build/ga-e2e/
          if-no-files-found: warn
          retention-days: 14
