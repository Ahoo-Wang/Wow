# The repository's one CI workflow: every pull request and push runs it, the
# scope job (.github/scripts/ci-scope.mjs) decides from the changed paths which
# areas run (the JVM build, the TypeScript packages, the site, the stories, the
# view store contract, the eShop web UI, the ops and catalog consoles, the
# workflows), and `ci-gate` is the merge signal: it passes when every job that
# ran passed. A manual dispatch runs everything.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Take new screenshot baselines and upload them for review instead of comparing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A pull request's new push cancels its older run. Every push to main runs to
  # the end in a group of its own commit: in one group a newer push replaces
  # the run still pending (GitHub keeps one), and that commit got no coverage
  # report, so Codecov compared later pull requests with an older base. A manual
  # full run (workflow_dispatch) gets its own group too.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: GITHUB_ACTIONS

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.scope.outputs.jvm }}
      typescript: ${{ steps.scope.outputs.typescript }}
      sdk: ${{ steps.scope.outputs.sdk }}
      unit-packages: ${{ steps.scope.outputs.unitPackages }}
      docs: ${{ steps.scope.outputs.docs }}
      view-engine: ${{ steps.scope.outputs.viewEngine }}
      package-docs: ${{ steps.scope.outputs.packageDocs }}
      view-engine-docs: ${{ steps.scope.outputs.viewEngineDocs }}
      workflows: ${{ steps.scope.outputs.workflows }}
      package: ${{ steps.scope.outputs.package }}
      storybook: ${{ steps.scope.outputs.storybook }}
      view-store-contract: ${{ steps.scope.outputs.viewStoreContract }}
      ops-console: ${{ steps.scope.outputs.opsConsole }}
      catalog-console: ${{ steps.scope.outputs.catalogConsole }}
      # The eShop web UI builds on the JVM services and the client packages.
      web: ${{ steps.scope.outputs.jvm == 'true' || steps.scope.outputs.sdk == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every integration test project is in exactly one shard
        run: node .github/scripts/integration-shards.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  # Compiles every V10 module, runs its unit tests (`:architecture:test` holds
  # the V10 dependency rules) and detekt over them.
  check:
    name: Check
    needs: scope
    if: needs.scope.outputs.jvm == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check the V10 modules with coverage
        run: ./gradlew :check :code-coverage-report:coverageReport --stacktrace
      # The release rehearsal of the Maven publications (R.1), signed with a
      # throwaway key the check generates (gpg): every V10 release module has
      # its jar, sources, javadoc, POM and metadata, signed, the BOM constrains
      # exactly them, no 9.x module is published, and the deploy jobs'
      # prebuilt publish uploads all of it with its signatures.
      - name: Check the V10 publications
        run: ./gradlew publicationCheck --stacktrace
      - name: Upload unit test coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: jvm-unit
          name: jvm-unit
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/coverageReport/coverageReport.xml

  # The container-backed tests of the V10 modules, in shards that run in parallel, each on a runner and a Docker of
  # its own; the H2 and H6 spikes' suites skip themselves unless their flags are set. Each project of
  # `integrationTestProjects` (build.gradle.kts) is in exactly one shard's `projects`: the scope job checks it
  # (.github/scripts/integration-shards.mjs). The shards are balanced by the tests' measured durations (eShop end
  # to end about 3 minutes, the host's about 1¾, Elasticsearch's 1¼, MongoDB's ¾, the rest under ½ each).
  integration:
    name: Integration Test (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.jvm == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: eshop
            projects: :eshop-e2e :eshop-ordering-server
          - shard: host-platform
            projects: :spring-boot :ops-server :view-store-server :analytics-catalog-server
          - shard: kafka-elasticsearch-clickhouse
            projects: :kafka :elasticsearch :clickhouse :routing-spike
          - shard: mongo-postgres
            projects: :mongo :postgres :migrate-data :lease-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run the V10 integration tests with coverage
        env:
          PROJECTS: ${{ matrix.projects }}
        run: >-
          ./gradlew :integrationTest :code-coverage-report:integrationCoverageReport
          "-Pwow.integration.projects=$PROJECTS" --stacktrace
      - name: Upload integration test coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: integration
          name: integration-${{ matrix.shard }}
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/integrationCoverageReport/integrationCoverageReport.xml

  # Every pull request: tracked files follow the canonical locations of the
  # documentation governance page, the documentation's code samples equal the
  # sources they show and import only published names, the English and Chinese
  # pages share one structure, configuration samples set only known keys, the
  # generated reference pages are what their sources give, and nothing is left
  # that no one reads (unused catalog entries, stale ignore and labeler paths,
  # CI scripts nothing runs). All read only the tracked files.
  docs-layout:
    name: Documentation layout
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Check documentation layout
        run: node .github/scripts/docs-layout.mjs
      - name: Check documentation samples
        run: node .github/scripts/docs-samples.mjs
      - name: Check documentation locales and configuration keys
        run: node .github/scripts/docs-consistency.mjs
      - name: Check generated reference pages
        run: node .github/scripts/docs-reference.mjs
      - name: Check repository hygiene
        run: node .github/scripts/repo-hygiene.mjs

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Check CI scripts
        run: pnpm test:ci-scripts
      # Build output under typescript/ must never be tracked.
      - name: Reject tracked build output
        run: |
          if git ls-files typescript | grep -E '/(dist|coverage|storybook-static|\.vitest-reports|test-output|node_modules)/'; then
            echo "::error::Build output is tracked; remove it and extend .gitignore"
            exit 1
          fi
      # gradle.properties is the one version source; every package.json follows it.
      - name: Check package versions
        run: node .github/scripts/project-version.mjs check
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      # Packages import each other through their built dist.
      - name: Build packages for static checks
        run: pnpm build:typescript
      - name: Lint without rewriting files
        run: pnpm lint
      - name: Check package types
        run: pnpm typecheck

  # One job per package and Node version, for every package but view-engine,
  # whose suite runs sharded below. The scope names the packages a change
  # reruns: a library's own tests rerun that library, its sources rerun it and
  # the packages built on it.
  unit:
    name: Unit / ${{ matrix.package }} / Node ${{ matrix.node-version }}
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload through OIDC.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.scope.outputs.unit-packages) }}
        # Node 20 reached end of life on 2026-04-30.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package and the workspace packages it imports through their dist.
      - name: Build the package and its dependencies
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "@ahoo-wang/$PACKAGE..." build
      - name: Test the package
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "@ahoo-wang/$PACKAGE" test
      # A flag per package, so Codecov carries forward the coverage of the
      # packages a scoped run left out.
      - name: Upload coverage
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: typescript,typescript-${{ matrix.package }}
          name: typescript-${{ matrix.package }}
          fail_ci_if_error: true
          disable_search: true
          files: ./typescript/${{ matrix.package }}/coverage/coverage-final.json

  # The npm packages as a consumer gets them: publint on the tarballs, types
  # under node16, nodenext and bundler resolution, and a fresh npm project that
  # installs, imports and requires them and runs the bins. Node 22.12.0 is the
  # floor engines.node promises; the release preflight runs the same check.
  # The scope turns it on with sdk and for any change inside a PUBLISHED
  # package (view-engine's too), without the unit matrix.
  package:
    name: Package / Node ${{ matrix.node-version }}
    needs: scope
    if: needs.scope.outputs.package == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every package in PUBLISHED and its workspace dependencies, from the
      # list package-check.mjs checks, so a newly published package is built.
      - name: Build the published packages
        run: |
          filters=()
          for pkg in $(node .github/scripts/publish-npm.mjs --list); do
            filters+=(--filter "$pkg...")
          done
          pnpm "${filters[@]}" build
      - name: Check the packages
        run: node .github/scripts/package-check.mjs

  # fetcher's floor. The workspace develops on the newest fetcher (the default
  # catalog), while the published packages accept the whole `peers` range, so
  # this job overrides every fetcher to that range's floor
  # (.github/scripts/fetcher-floor.mjs), reruns the tests of the packages with
  # a fetcher peer, and checks the tarballs as a consumer on the floor. One
  # job, not a matrix: unit and package cover the newest fetcher.
  fetcher-floor:
    name: Fetcher floor
    needs: scope
    if: needs.scope.outputs.package == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Pin fetcher to the floor of the peers range
        run: node .github/scripts/fetcher-floor.mjs pin
      # The overrides change resolution, so the lockfile cannot be frozen.
      - run: pnpm install --no-frozen-lockfile
      - name: Check that every package resolves the floor
        run: node .github/scripts/fetcher-floor.mjs verify
      - name: Build the published packages
        run: |
          filters=()
          for pkg in $(node .github/scripts/publish-npm.mjs --list); do
            filters+=(--filter "$pkg...")
          done
          pnpm "${filters[@]}" build
      - name: Test the packages with a fetcher peer
        run: >-
          pnpm --filter @ahoo-wang/wow-client --filter @ahoo-wang/wow-react
          --filter @ahoo-wang/wow-generator --filter @ahoo-wang/wow-view-store
          test
      - name: Check the packages on the floor
        run: node .github/scripts/package-check.mjs --fetcher-floor

  # View-engine's suite (`vitest run --coverage && pnpm test:type`) split in
  # four: each shard collects its quarter of the coverage as a blob report, and
  # `view-engine` merges them, holding the thresholds once. Four, not three:
  # the merge job runs after the slowest shard, so this path is the longest.
  view-engine-shard:
    name: View engine / Node 24 (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test shard
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --reporter=default
      - name: Preserve shard report
        uses: actions/upload-artifact@v7
        with:
          name: view-engine-blob-${{ matrix.shard }}
          path: typescript/wow-view-engine/.vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  view-engine:
    name: View engine
    needs: [scope, view-engine-shard]
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload through OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:type checks the package against its built dependencies.
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - uses: actions/download-artifact@v7
        with:
          pattern: view-engine-blob-*
          merge-multiple: true
          path: typescript/wow-view-engine/.vitest-reports
      - name: Merge shards and hold coverage thresholds
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --merge-reports --coverage
      - name: Check types
        working-directory: typescript/wow-view-engine
        run: pnpm test:type
      - name: Upload view-engine coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: typescript,typescript-wow-view-engine
          name: typescript-wow-view-engine
          fail_ci_if_error: true
          disable_search: true
          files: ./typescript/wow-view-engine/coverage/coverage-final.json

  # Node 22 formats dates and numbers with its own ICU; the same assertions,
  # without coverage, in three shards that finish before Node 24's shards and
  # their merge.
  view-engine-node22:
    name: View engine / Node 22 (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test shard
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --coverage.enabled=false --shard=${{ matrix.shard }}/3

  # Markdown alone under typescript/: check its formatting (quality does when
  # it runs) and, for view-engine, run the tests that read it instead of the
  # sharded suite (which runs them when it runs).
  package-docs:
    name: Package docs
    needs: scope
    if: needs.scope.outputs.package-docs == 'true' || needs.scope.outputs.view-engine-docs == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        if: needs.scope.outputs.package-docs == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      - name: Build view-engine dependencies
        if: needs.scope.outputs.view-engine-docs == 'true'
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test view-engine docs
        if: needs.scope.outputs.view-engine-docs == 'true'
        run: pnpm --filter @ahoo-wang/wow-view-engine test:docs

  docs:
    name: Documentation
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site's tests compile the TypeScript samples of its pages and the
      # package READMEs against the built packages.
      - name: Build the packages the samples import
        run: pnpm --filter 'documentation^...' build
      - name: Build VitePress site
        run: pnpm --filter documentation docs:build
      # Storybook lands in dist/storybook after VitePress, as on the deployed
      # site, so the tests below check every story link against its index.json.
      - name: Build Storybook into the site
        run: pnpm --filter documentation storybook:build
      - name: Test built site
        run: node --test documentation/test/*.test.mjs

  # actionlint (with shellcheck) over every workflow: the static checks read
  # only the TypeScript ones, and nothing else reads the release and deploy
  # workflows before they run.
  workflow-lint:
    name: Workflow lint
    needs: scope
    if: needs.scope.outputs.workflows == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

  # The V10 store (`@ahoo-wang/wow-view-store`) and the view engine on it
  # against the V10 view store service (platform/view-store) built from this
  # commit in the V10 build scope (`pnpm test`, roadmap 7.3a). The suites'
  # global setup starts the service in a JVM on the memory backend, every port
  # bound to 0, so no container or database runs; it prints the service's log
  # when the service fails to start.
  view-store-contract:
    name: View store contract
    needs: scope
    if: needs.scope.outputs.view-store-contract == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The service with the in-memory query backend of its own tests (its test
      # classes and the query backend specs, :query-tck, once :query's test
      # fixtures), as the global setup (test/view-store/globalSetup.ts) loads it.
      - name: Build the V10 view store service
        run: ./gradlew :view-store-server:installDist :view-store-server:testClasses :query-tck:jar --stacktrace
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter @ahoo-wang/wow-view-store... build
      - name: Test the V10 store against the service
        run: pnpm --filter wow-integration-test test

  storybook-build:
    name: Build Storybook
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The stories type-check against the packages' built declarations.
      - name: Build packages
        run: pnpm --filter 'wow-storybook^...' build
      - name: Type-check the stories
        run: pnpm --filter wow-storybook typecheck
      - name: Lint the stories
        run: pnpm --filter wow-storybook lint
      - name: Build Storybook and verify its index
        run: pnpm --filter wow-storybook build

  # The browser project runs one file at a time, so a shard lasts as long as
  # its files add up to. The shard sequencer (storybook/scripts/
  # shard-sequencer.mjs) splits them by their measured durations
  # (storybook/test-durations.json) into shards of about equal length; each
  # shard uploads its JSON report to refresh those durations from.
  storybook-interactions:
    name: Storybook interactions (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No package build: Storybook resolves the Wow packages to their sources
      # (.storybook/main.ts), so dist/ is never read here.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter wow-storybook exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The download is keyed on the Playwright version; system libraries still
      # come from --with-deps on every run.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browser
        run: pnpm --filter wow-storybook exec playwright install --with-deps chromium
      - name: Test Storybook interactions
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter wow-storybook test --shard="$SHARD/4" --reporter=default --reporter=json --outputFile.json=".vitest-reports/durations-$SHARD.json"
      - name: Preserve file durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: storybook-durations-${{ matrix.shard }}
          path: typescript/storybook/.vitest-reports/durations-${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # The screenshot baselines (typescript/storybook/baselines): the stories
  # tagged `visual`, compared picture by picture against a browser in
  # Playwright's own Linux container, the image of the resolved `playwright`
  # version (storybook/scripts/linux-browser.mjs) — the same pictures a
  # developer takes with `pnpm --filter wow-storybook test:visual` on any
  # machine. A dispatch with `update-screenshots` takes new ones instead and
  # uploads them; a person looks at them and commits them.
  storybook-visual:
    name: Storybook screenshots
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the screenshots
        env:
          UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update-screenshots }}
        run: |
          if [ "$UPDATE" = true ]; then
            pnpm --filter wow-storybook test:visual --update
          else
            pnpm --filter wow-storybook test:visual
          fi
      - name: Preserve the differing screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-screenshot-diffs
          path: typescript/storybook/.vitest-attachments
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve the new baselines
        if: github.event_name == 'workflow_dispatch' && inputs.update-screenshots
        uses: actions/upload-artifact@v7
        with:
          name: storybook-screenshot-baselines
          path: typescript/storybook/baselines
          retention-days: 7

  # Lint, types (the build's `tsc -b`), the component tests with the generated
  # clients held byte for byte against the Manifest baselines, and the build.
  eshop-web:
    name: eShop Web Test
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-eshop-web...
      - name: Build the UI and the workspace packages it uses
        run: pnpm --filter wow-eshop-web... build
      - name: Lint
        working-directory: example/eshop/web
        run: pnpm lint
      - name: Test
        working-directory: example/eshop/web
        run: pnpm coverage

  # The UI end to end: the five eShop services in one JVM in memory
  # (EshopLocal, no containers), the dev server, Chromium.
  eshop-web-e2e:
    name: eShop Web E2E
    needs: scope
    if: needs.scope.outputs.web == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build the eShop services
        run: ./gradlew :eshop-e2e:eshopLocalClasspath --stacktrace
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-eshop-web...
      - name: Build the workspace packages the UI uses
        run: pnpm --filter "wow-eshop-web^..." build
      - name: Install Chromium
        working-directory: example/eshop/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Test end to end
        working-directory: example/eshop/web
        run: pnpm test:e2e
      - name: Upload the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eshop-web-e2e
          path: example/eshop/web/test-results/
          retention-days: 7

  ops-console:
    name: Ops Console
    needs: scope
    if: needs.scope.outputs.ops-console == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-ops-console...
      - name: Build the workspace packages the console uses
        run: pnpm --filter 'wow-ops-console^...' build
      - name: Lint
        working-directory: platform/ops/console
        run: pnpm lint
      # Both tsc configurations, then vite build.
      - name: Typecheck and build
        working-directory: platform/ops/console
        run: pnpm build
      # Includes the generated client held byte for byte to the ops server's
      # Manifest baseline.
      - name: Test with coverage
        working-directory: platform/ops/console
        run: pnpm coverage

  ops-console-e2e:
    name: Ops Console End to End
    needs: scope
    if: needs.scope.outputs.ops-console == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The server's distribution and test classes: the suite starts it with
      # its ledger simulator (e2e/start-ops-server.mjs).
      - name: Build the ops server
        run: ./gradlew :ops-server:installDist :ops-server:testClasses --stacktrace
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-ops-console...
      - name: Build the console
        run: pnpm --filter 'wow-ops-console...' build
      - name: Install Chromium
        working-directory: platform/ops/console
        run: pnpm exec playwright install --with-deps chromium
      - name: Test end to end
        working-directory: platform/ops/console
        run: pnpm test:e2e
      - name: Upload the failures' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-console-e2e
          path: platform/ops/console/test-results/
          retention-days: 7

  # The analytics catalog console (platform/analytics/catalog/console, roadmap
  # 7.2c): its lint, types, unit and component tests with coverage, and build;
  # then its end-to-end suite in Playwright's Chromium against the real catalog
  # server (platform/analytics/catalog/server) on its memory backend, with JDK
  # 21.
  catalog-console:
    name: Catalog Console
    needs: scope
    if: needs.scope.outputs.catalog-console == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-analytics-catalog-console...
      - name: Build the workspace packages the console uses
        run: pnpm --filter 'wow-analytics-catalog-console^...' build
      - name: Lint
        working-directory: platform/analytics/catalog/console
        run: pnpm lint
      # Both tsc configurations, then vite build.
      - name: Typecheck and build
        working-directory: platform/analytics/catalog/console
        run: pnpm build
      # Includes the generated client held byte for byte to the catalog
      # server's Manifest baseline.
      - name: Test with coverage
        working-directory: platform/analytics/catalog/console
        run: pnpm coverage

  catalog-console-e2e:
    name: Catalog Console End to End
    needs: scope
    if: needs.scope.outputs.catalog-console == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The server's distribution and test classes: the suite starts it with
      # its warehouse simulator (e2e/start-catalog-server.mjs).
      - name: Build the catalog server
        run: ./gradlew :analytics-catalog-server:installDist :analytics-catalog-server:testClasses --stacktrace
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-analytics-catalog-console...
      - name: Build the console
        run: pnpm --filter 'wow-analytics-catalog-console...' build
      - name: Install Chromium
        working-directory: platform/analytics/catalog/console
        run: pnpm exec playwright install --with-deps chromium
      - name: Test end to end
        working-directory: platform/analytics/catalog/console
        run: pnpm test:e2e
      - name: Upload the failures' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-console-e2e
          path: platform/analytics/catalog/console/test-results/
          retention-days: 7

  # The merge signal: every job above passed, or the scope skipped it.
  ci-gate:
    name: ci-gate
    needs:
      [
        scope,
        check,
        integration,
        docs-layout,
        quality,
        unit,
        package,
        fetcher-floor,
        view-engine-shard,
        view-engine,
        view-engine-node22,
        package-docs,
        docs,
        workflow-lint,
        view-store-contract,
        storybook-build,
        storybook-interactions,
        storybook-visual,
        eshop-web,
        eshop-web-e2e,
        ops-console,
        ops-console-e2e,
        catalog-console,
        catalog-console-e2e,
      ]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # The required checks of v10's branch protection before ci-gate, kept as
  # aliases of it until the protection requires ci-gate; then they go. Each
  # runs whatever ci-gate concluded and fails unless it passed: a job skipped
  # because what it needs failed would count as passing.
  v10-gate:
    name: v10-gate
    needs: ci-gate
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require ci-gate to pass
        env:
          RESULT: ${{ needs.ci-gate.result }}
        run: |
          echo "ci-gate: $RESULT"
          test "$RESULT" = success

  typescript-gate:
    name: typescript-gate
    needs: ci-gate
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require ci-gate to pass
        env:
          RESULT: ${{ needs.ci-gate.result }}
        run: |
          echo "ci-gate: $RESULT"
          test "$RESULT" = success

  typescript-contract-gate:
    name: typescript-contract-gate
    needs: ci-gate
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require ci-gate to pass
        env:
          RESULT: ${{ needs.ci-gate.result }}
        run: |
          echo "ci-gate: $RESULT"
          test "$RESULT" = success

  typescript-storybook-gate:
    name: typescript-storybook-gate
    needs: ci-gate
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require ci-gate to pass
        env:
          RESULT: ${{ needs.ci-gate.result }}
        run: |
          echo "ci-gate: $RESULT"
          test "$RESULT" = success
