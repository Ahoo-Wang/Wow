# The blue-green rehearsal of roadmap 8c.1 (design 07 §3, decision D32) on a GitHub runner: the 9.x example-server
# built from `nine_x_ref` (v10-9x-baseline, D262), seeded at a production-shaped size, migrated by migrate-data into
# the Wow 10 logs of the rehearsal host and of the Wow 10 view store service, cut over with a dual-run window on standby
# hosts, and rolled back before and after Wow 10 writes; an offline cut-over of the same data (D267 ⑳) runs first
# (test/migration-rehearsal/rehearsal/rehearse.sh). The report is the run's summary; the steps' logs are an artifact.
#
# `migrate_in` chooses the arm, or both, each on a runner of its own: `runner`, the stores in containers and
# migrate-data from its distribution; `kind`, the stores in a kind cluster and every migrate-data command a Job of the
# wow-migrate-data image built from the commit, as deploy/migrate-data runs it (rehearsal/kind/kind.sh), with the
# import timed by where it runs, in the cluster or on the runner.
#
# `mode: bench` (the kind arm alone) seeds the 9.x store, then times the import of two migrate-data images and nothing
# else: `baseline_ref`'s (A; the commit's own when empty, an A/A run) against the commit's (B), A B B A, each into a
# fresh database (rehearsal/kind/kind.sh bench_imports); `views` sizes the view store's share of the seed. `mode: cutover`
# (the kind arm alone) times the write stop of an online cut-over by the same two images, A B B A, each after its own
# import and dual run with 9.x serving (kind.sh cutover_bench).
#
# A run starts when a branch `ci-repro/migration-rehearsal/**` is pushed (`git push origin <ref>:ci-repro/migration-rehearsal/<name>`), with the
# defaults below, over which `test/migration-rehearsal/rehearsal/run.json` at the pushed commit may set `orders`,
# `dual_run_seconds`, `v10_seconds`, `concurrency`, `sample`, `final_pass`, `nine_x_ref` and `migrate_in`. Delete the
# branch afterwards. It can also be dispatched by hand once the file is on the default branch. Never on a pull request
# or a schedule: the heavy run belongs here, not on a pull request's checks.
name: Migration rehearsal
on:
  workflow_dispatch:
    inputs:
      orders:
        description: 'Orders the 9.x example is seeded with'
        type: string
        default: '50000'
      dual_run_seconds:
        description: 'Seconds 9.x takes writes while the tail follows it'
        type: string
        default: '120'
      v10_seconds:
        description: 'Seconds Wow 10 takes writes before the rollback'
        type: string
        default: '60'
      concurrency:
        description: 'Concurrent commands of the driver'
        type: string
        default: '64'
      sample:
        description: 'Every n-th order whose state is compared across the rollbacks'
        type: string
        default: '10'
      final_pass:
        description: 'The final pass after 9.x stops: final (import --final, the tail from its checkpoint) or restart'
        type: choice
        options: ['final', 'restart']
        default: 'final'
      nine_x_ref:
        description: 'Ref the 9.x example-server is built from'
        type: string
        default: 'v10-9x-baseline'
      migrate_in:
        description: 'Where migrate-data and the stores run: runner, kind (the image as Jobs in a kind cluster), or both'
        type: choice
        options: ['runner', 'kind', 'both']
        default: 'runner'
      mode:
        description: 'rehearsal (the cut-overs and rollbacks), bench (the import of two images, A B B A, on kind) or cutover (their write stop, A B B A, on kind)'
        type: choice
        options: ['rehearsal', 'bench', 'cutover']
        default: 'rehearsal'
      baseline_ref:
        description: 'bench: the ref of the baseline image (A); empty for the commit itself, an A/A run'
        type: string
        default: ''
      views:
        description: 'Views the 9.x example is seeded with; empty for a quarter of the orders'
        type: string
        default: ''
  push:
    branches: ['ci-repro/migration-rehearsal/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: GITHUB_ACTIONS

jobs:
  settings:
    name: Settings
    if: github.repository == 'Ahoo-Wang/Wow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      orders: ${{ steps.settings.outputs.orders }}
      dual_run_seconds: ${{ steps.settings.outputs.dual_run_seconds }}
      v10_seconds: ${{ steps.settings.outputs.v10_seconds }}
      concurrency: ${{ steps.settings.outputs.concurrency }}
      sample: ${{ steps.settings.outputs.sample }}
      final_pass: ${{ steps.settings.outputs.final_pass }}
      nine_x_ref: ${{ steps.settings.outputs.nine_x_ref }}
      arms: ${{ steps.settings.outputs.arms }}
      mode: ${{ steps.settings.outputs.mode }}
      baseline_ref: ${{ steps.settings.outputs.baseline_ref }}
      views: ${{ steps.settings.outputs.views }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Settings
        id: settings
        env:
          EVENT: ${{ github.event_name }}
          ORDERS: ${{ inputs.orders }}
          DUAL_RUN_SECONDS: ${{ inputs.dual_run_seconds }}
          V10_SECONDS: ${{ inputs.v10_seconds }}
          CONCURRENCY: ${{ inputs.concurrency }}
          SAMPLE: ${{ inputs.sample }}
          FINAL_PASS: ${{ inputs.final_pass }}
          NINE_X_REF: ${{ inputs.nine_x_ref }}
          MIGRATE_IN: ${{ inputs.migrate_in }}
          MODE: ${{ inputs.mode }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          VIEWS: ${{ inputs.views }}
        run: |
          python3 - <<'EOF' >>"$GITHUB_OUTPUT"
          import json, os, re
          defaults = {"orders": "50000", "dual_run_seconds": "120", "v10_seconds": "60", "concurrency": "64",
                      "sample": "10", "final_pass": "final",
                      "nine_x_ref": "v10-9x-baseline", "migrate_in": "runner", "mode": "rehearsal",
                      "baseline_ref": "", "views": ""}
          settings = dict(defaults)
          if os.environ["EVENT"] == "push":
              path = "test/migration-rehearsal/rehearsal/run.json"
              if os.path.exists(path):
                  settings.update({key: str(value) for key, value in json.load(open(path)).items() if key in defaults})
          else:
              settings.update({key: os.environ[key.upper()] for key in defaults if os.environ.get(key.upper())})
          patterns = {"nine_x_ref": r"[A-Za-z0-9._/-]+", "migrate_in": r"runner|kind|both", "mode": r"rehearsal|bench|cutover",
                      "baseline_ref": r"[A-Za-z0-9._/-]*", "views": r"[0-9]*"}
          for key, value in settings.items():
              if not re.fullmatch(patterns.get(key, r"[0-9]+|final|restart"), value):
                  raise SystemExit(f"{key}: {value!r} is not a valid setting")
              if key != "migrate_in":
                  print(f"{key}={value}")
          arm = "kind" if settings["mode"] in ("bench", "cutover") else settings["migrate_in"]
          print("arms=" + json.dumps(["runner", "kind"] if arm == "both" else [arm]))
          EOF

  rehearse:
    name: Rehearse (${{ matrix.migrate_in }})
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.settings.outputs.mode != 'rehearsal' && 300 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        migrate_in: ${{ fromJSON(needs.settings.outputs.arms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.settings.outputs.nine_x_ref }}
          path: ninex
          persist-credentials: false
      # Which JVM each part runs on: the builds and the 9.x stand-in on JDK 21, the last listed and so JAVA_HOME (the
      # 9.x code's own); the V10 hosts, migrate-data's installation (the runner arm) and the driver on JDK 25
      # (JAVA_HOME_25_X64, V10_JAVA_HOME below), as V10 runs (D368, D393); the migrate-data images (the kind arm) on
      # the JDK 25 their Dockerfile names. The report records each one's full version.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
      # The refs are inputs, so the Gradle cache is only read here, never written.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Build
        run: |
          ./gradlew :migration-rehearsal:installDist :view-store-server:installDist :migrate-data:installDist --stacktrace
          (cd ninex && ./gradlew :example-server:installDist -x test --stacktrace)
      # The tool's image, and the images of both V10 hosts, whose lib deploy/migrate-data's init containers copy.
      - name: Build the images
        if: matrix.migrate_in == 'kind'
        run: |
          docker build -q -t wow-migrate-data:local migration/migrate-data
          docker build -q -t wow-view-store-server:local platform/view-store/view-store-server
          docker build -q -f test/migration-rehearsal/rehearsal/kind/Dockerfile -t wow-migration-rehearsal:local \
            test/migration-rehearsal
      # bench and cutover: the baseline image (A), from baseline_ref, or the commit's own for an A/A run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.settings.outputs.mode != 'rehearsal' && needs.settings.outputs.baseline_ref != ''
        with:
          ref: ${{ needs.settings.outputs.baseline_ref }}
          path: baseline
          persist-credentials: false
      - name: Build the baseline image
        if: needs.settings.outputs.mode != 'rehearsal'
        env:
          BASELINE_REF: ${{ needs.settings.outputs.baseline_ref }}
        run: |
          if [ -z "$BASELINE_REF" ]; then
            docker tag wow-migrate-data:local wow-migrate-data:baseline
          else
            (cd baseline && ./gradlew :migrate-data:installDist --stacktrace)
            docker build -q -t wow-migrate-data:baseline baseline/migration/migrate-data
          fi
      - name: Create the kind cluster
        if: matrix.migrate_in == 'kind'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: wow-rehearsal
          config: test/migration-rehearsal/rehearsal/kind/kind.yaml
          wait: 120s
      - name: Load the images
        if: matrix.migrate_in == 'kind'
        env:
          MODE: ${{ needs.settings.outputs.mode }}
        run: |
          images=(wow-migrate-data:local wow-view-store-server:local wow-migration-rehearsal:local)
          if [ "$MODE" != rehearsal ]; then images+=(wow-migrate-data:baseline); fi
          kind load docker-image --name wow-rehearsal "${images[@]}"
      - name: Rehearse
        env:
          NINEX_HOME: ${{ github.workspace }}/ninex/example/example-server/build/install/example-server
          V10_HOME: ${{ github.workspace }}/test/migration-rehearsal/build/install/migration-rehearsal
          VIEWS_HOME: ${{ github.workspace }}/platform/view-store/view-store-server/build/install/view-store-server
          VIEWS_MANIFEST: ${{ github.workspace }}/platform/view-store/view-store-server/manifest/baseline.json
          MIGRATE_HOME: ${{ github.workspace }}/migration/migrate-data/build/install/migrate-data
          MANIFEST: ${{ github.workspace }}/test/migration-rehearsal/build/wow/manifest-fragment/META-INF/wow/manifest/migration-rehearsal.json
          WORK: ${{ runner.temp }}/rehearsal
          ORDERS: ${{ needs.settings.outputs.orders }}
          DUAL_RUN_SECONDS: ${{ needs.settings.outputs.dual_run_seconds }}
          V10_SECONDS: ${{ needs.settings.outputs.v10_seconds }}
          CONCURRENCY: ${{ needs.settings.outputs.concurrency }}
          SAMPLE: ${{ needs.settings.outputs.sample }}
          FINAL_PASS: ${{ needs.settings.outputs.final_pass }}
          MIGRATE_IN: ${{ matrix.migrate_in }}
          MODE: ${{ needs.settings.outputs.mode }}
          VIEWS: ${{ needs.settings.outputs.views }}
          NINEX_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          V10_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: test/migration-rehearsal/rehearsal/rehearse.sh
      - name: Collect the cluster's diagnostics
        if: always() && matrix.migrate_in == 'kind'
        env:
          WORK: ${{ runner.temp }}/rehearsal
        run: |
          mkdir -p "$WORK/cluster"
          kubectl get pods,jobs,deployments,networkpolicies -o wide >"$WORK/cluster/resources.txt" 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp >"$WORK/cluster/events.txt" 2>&1 || true
          for pod in $(kubectl get pods -o name 2>/dev/null); do
            kubectl logs "$pod" --all-containers >"$WORK/cluster/${pod#pod/}.log" 2>&1 || true
          done
      - name: Summary
        if: always()
        env:
          WORK: ${{ runner.temp }}/rehearsal
          ARM: ${{ matrix.migrate_in }}
        run: |
          if [ -f "$WORK/steps.jsonl" ]; then
            python3 test/migration-rehearsal/rehearsal/report.py "$WORK" >"$WORK/report.md" || true
            { echo "Arm: $ARM"; echo; cat "$WORK/report.md"; } >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-rehearsal-${{ matrix.migrate_in }}
          path: ${{ runner.temp }}/rehearsal
          retention-days: 14
          if-no-files-found: warn
