# The eShop's fault-injection soak (work package C.1, `:eshop-e2e:soakTest`)
# on the v10 branch. v10-nightly.yml (on main) dispatches it on v10 every night
# v10 moved; it can also be dispatched by hand. The test fails when any
# invariant is violated (EshopSoakTest asserts zero violations, the task never
# retries), which fails the job; the report, the request log, every node's
# output and the thread dumps are uploaded either way.
name: V10 Soak
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'ISO-8601 duration of the load in full mode'
        type: string
        default: 'PT1H'
      mode:
        description: '`short`: 5 minutes, a fault every 30 s (the duration is ignored)'
        type: choice
        options: [full, short]
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: GITHUB_ACTIONS

jobs:
  soak:
    name: eShop Soak
    if: github.repository == 'Ahoo-Wang/Wow'
    timeout-minutes: 100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Soak
        env:
          DURATION: ${{ inputs.duration || 'PT1H' }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = short ]; then
            soak=(-Pwow.soak.mode=short)
          elif [[ "$DURATION" =~ ^P[0-9A-Z.]+$ ]]; then
            soak=(-Pwow.soak.duration="$DURATION")
          else
            echo "::error::Not an ISO-8601 duration: $DURATION"
            exit 1
          fi
          ./gradlew -Pwow.scope=v10 :eshop-e2e:soakTest "${soak[@]}" --stacktrace
      - name: Summarize the report
        if: always()
        run: |
          # report-<yyyyMMdd-HHmmss>.json: the last in glob order is the newest.
          report=
          for file in example/eshop/e2e/build/eshop-soak/report-*.json; do
            [ -e "$file" ] && report=$file
          done
          if [ -z "$report" ]; then
            echo "No soak report was written; see the Soak step's log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### eShop soak: $(jq .violations "$report") violations"
            echo
            echo '| Invariant | OK | Checked | Violations |'
            echo '| --- | --- | --- | --- |'
            jq -r '.invariants[] | "| `\(.name)` | \(.ok) | \(.checked) | \(.violations) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report, the logs and the thread dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eshop-soak
          path: example/eshop/e2e/build/eshop-soak/
          if-no-files-found: warn
          retention-days: 14
