# Storybook of the Wow TypeScript packages (typescript/storybook). Every pull
# request triggers this workflow; the scope job decides whether its jobs run,
# and `typescript-storybook-gate` is the merge signal.
name: TypeScript Storybook
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual full run (workflow_dispatch) gets its own group: in the push group
  # it would sit pending behind main's runs and be replaced by the next merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.scope.outputs.storybook }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  build:
    name: Build Storybook
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The stories type-check against the packages' built declarations.
      - name: Build packages
        run: pnpm --filter 'wow-storybook^...' build
      - name: Type-check the stories
        run: pnpm --filter wow-storybook typecheck
      - name: Lint the stories
        run: pnpm --filter wow-storybook lint
      - name: Build Storybook and verify its index
        run: pnpm --filter wow-storybook build

  # The browser project runs one file at a time, so a shard lasts as long as
  # its files add up to. The shard sequencer (storybook/scripts/
  # shard-sequencer.mjs) splits them by their measured durations
  # (storybook/test-durations.json) into shards of about equal length; each
  # shard uploads its JSON report to refresh those durations from.
  interactions:
    name: Storybook interactions (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No package build: Storybook resolves the Wow packages to their sources
      # (.storybook/main.ts), so dist/ is never read here.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter wow-storybook exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The download is keyed on the Playwright version; system libraries still
      # come from --with-deps on every run.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browser
        run: pnpm --filter wow-storybook exec playwright install --with-deps chromium
      - name: Test Storybook interactions
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter wow-storybook test --shard="$SHARD/4" --reporter=default --reporter=json --outputFile.json=".vitest-reports/durations-$SHARD.json"
      - name: Preserve file durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: storybook-durations-${{ matrix.shard }}
          path: typescript/storybook/.vitest-reports/durations-${{ matrix.shard }}.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  typescript-storybook-gate:
    name: typescript-storybook-gate
    needs: [scope, build, interactions]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
