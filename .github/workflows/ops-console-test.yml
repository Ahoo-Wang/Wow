# The ops console (platform/ops/console, roadmap 7.1b) on the v10 branch: its
# lint, types, unit and component tests with coverage, and build; then its
# end-to-end suite in Playwright's Chromium against the real ops server
# (platform/ops/ops-server) on its memory backend, with JDK 21. Every pull
# request to v10 triggers this workflow; the scope job
# (.github/scripts/ci-scope.mjs, `opsConsole`) decides whether the jobs run,
# and `ops-console-gate` is the merge signal: it passes when they pass or when
# the scope skipped them.
name: Ops Console Test
on:
  pull_request:
    branches: [v10]
  push:
    branches: [v10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: GITHUB_ACTIONS

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      opsConsole: ${{ steps.scope.outputs.opsConsole }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  console:
    name: Ops Console
    needs: scope
    if: needs.scope.outputs.opsConsole == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-ops-console...
      - name: Build the workspace packages the console uses
        run: pnpm --filter 'wow-ops-console^...' build
      - name: Lint
        working-directory: platform/ops/console
        run: pnpm lint
      # Both tsc configurations, then vite build.
      - name: Typecheck and build
        working-directory: platform/ops/console
        run: pnpm build
      # Includes the generated client held byte for byte to the ops server's
      # Manifest baseline.
      - name: Test with coverage
        working-directory: platform/ops/console
        run: pnpm coverage

  e2e:
    name: Ops Console End to End
    needs: scope
    if: needs.scope.outputs.opsConsole == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The server's distribution and test classes: the suite starts it with
      # its ledger simulator (e2e/start-ops-server.mjs).
      - name: Build the ops server
        run: ./gradlew :ops-server:installDist :ops-server:testClasses --stacktrace
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: 'pnpm'
      - name: Install packages
        run: pnpm install --frozen-lockfile --filter wow-ops-console...
      - name: Build the console
        run: pnpm --filter 'wow-ops-console...' build
      - name: Install Chromium
        working-directory: platform/ops/console
        run: pnpm exec playwright install --with-deps chromium
      - name: Test end to end
        working-directory: platform/ops/console
        run: pnpm test:e2e
      - name: Upload the failures' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-console-e2e
          path: platform/ops/console/test-results/
          retention-days: 7

  ops-console-gate:
    name: Ops Console Gate
    needs: [scope, console, e2e]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended $result."; exit 1 ;;
            esac
          done
