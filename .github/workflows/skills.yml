name: Skills
on:
  push:
    branches: [ main ]
    paths:
      - "skills/**"
      - "scripts/validate_wow_skills.py"
      - "scripts/test_validate_wow_skills.py"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_wow_skills.py"
      - "scripts/test_validate_wow_skills.py"
      - ".github/workflows/skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      # Standard library only: the validator checks structure, the plugin manifest and eval data.
      - name: Validate structure and eval data
        run: python3 -S scripts/validate_wow_skills.py
      - name: Validator regression tests
        run: python3 -S -m unittest scripts.test_validate_wow_skills
