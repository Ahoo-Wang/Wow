# Spike H2, stage 2 (decision D155, `:routing-spike:h2Stage2`): three node JVMs
# forwarding commands over the real cluster channel on a durable PostgreSQL,
# p50/p99/p999 against stage 1, and the unavailability window of each
# partition when its owner is killed. Dispatched by hand only; never on a pull
# request or a schedule, and no merge signal. The
# report (report.json, report.md) and every node's output are uploaded; the
# summary goes to the job summary.
name: H2 Stage 2
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'ISO-8601 measured window of each run (four runs: uniform and Zipf, Partitioned and Local)'
        type: string
        default: 'PT5M'
      rate:
        description: 'Commands per second, offered open loop'
        type: string
        default: '400'
      mode:
        description: '`smoke`: seconds, on 2000 accounts, only checks the harness (duration and rate are ignored)'
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: GITHUB_ACTIONS

jobs:
  measure:
    name: H2 Stage 2
    if: github.repository == 'Ahoo-Wang/Wow'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check the ref
        run: |
          if [ ! -d test/routing-spike/src/stage2 ]; then
            echo "::error::$GITHUB_REF has no H2 stage 2 (:routing-spike:h2Stage2); dispatch the workflow on main."
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Measure
        env:
          DURATION: ${{ inputs.duration || 'PT5M' }}
          RATE: ${{ inputs.rate || '400' }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = smoke ]; then
            settings=(-Pwow.h2.stage2.mode=smoke)
          elif [[ ! "$DURATION" =~ ^P[0-9A-Z.]+$ ]]; then
            echo "::error::Not an ISO-8601 duration: $DURATION"
            exit 1
          elif [[ ! "$RATE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Not a rate: $RATE"
            exit 1
          else
            settings=(-Pwow.h2.stage2.duration="$DURATION" -Pwow.h2.stage2.rate="$RATE")
          fi
          ./gradlew :routing-spike:h2Stage2 "${settings[@]}" --stacktrace
      - name: Summarize the report
        if: always()
        run: |
          report=test/routing-spike/build/h2-stage2/report.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No H2 stage-2 report was written; see the Measure step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report and the nodes' output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: h2-stage2
          path: test/routing-spike/build/h2-stage2/
          if-no-files-found: warn
          retention-days: 30
