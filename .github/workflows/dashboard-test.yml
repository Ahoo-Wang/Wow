name: Dashboard Test
on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-test.yml'
      - 'compensation/dashboard/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      # Workspace packages the dashboard builds against (wow-client, wow-react,
      # wow-view-engine) or builds as a dependency (wow-generator).
      - 'typescript/wow-client/**'
      - 'typescript/wow-react/**'
      - 'typescript/wow-view-engine/**'
      - 'typescript/wow-generator/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: GITHUB_ACTIONS

jobs:
  dashboard-test:
    name: Dashboard Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: 'pnpm'

      - name: Install Packages
        run: pnpm install --frozen-lockfile --filter wow-compensation-dashboard...

      - name: Lint Dashboard
        working-directory: compensation/dashboard
        run: pnpm exec eslint .

      - name: Build Dashboard
        run: pnpm --filter wow-compensation-dashboard... build

      - name: Test Dashboard
        working-directory: compensation/dashboard
        run: pnpm coverage

      - name: Install Chromium
        working-directory: compensation/dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Dashboard in Chromium
        working-directory: compensation/dashboard
        run: pnpm test:browser

      - name: Upload Browser Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: compensation/dashboard/playwright-report/
          retention-days: 7
