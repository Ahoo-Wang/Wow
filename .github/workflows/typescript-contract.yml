# Contract tests of the V10 store and the view engine on it against the V10
# view store service. The contracts against 9.x example servers left with the
# 9.x code (decision D262).
# Every pull request triggers this workflow; the scope job decides which jobs
# run, and `typescript-contract-gate` is the merge signal.
name: TypeScript Contract
on:
  pull_request:
    branches: [main, v10]
  push:
    branches: [main, v10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual full run (workflow_dispatch) gets its own group: in the push group
  # it would sit pending behind main's runs and be replaced by the next merge.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      v10-contract: ${{ steps.scope.outputs.v10Contract }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  # The V10 store (`@ahoo-wang/wow-view-store`) and the view engine on it
  # against the V10 view store service (platform/view-store) built from this
  # commit in the V10 build scope (`pnpm test`, roadmap 7.3a). The suites'
  # global setup starts the service in a JVM on the memory backend, every port
  # bound to 0, so no container or database runs; it prints the service's log
  # when the service fails to start.
  v10-contract:
    name: V10 view store contract
    needs: scope
    if: needs.scope.outputs.v10-contract == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The service with the in-memory query backend of its own tests (its test
      # classes and the query backend specs, :query-tck, once :query's test
      # fixtures), as the global setup (test/view-store/globalSetup.ts) loads it.
      - name: Build the V10 view store service
        run: ./gradlew :view-store-server:installDist :view-store-server:testClasses :query-tck:jar --stacktrace
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter @ahoo-wang/wow-view-store... build
      - name: Test the V10 store against the service
        run: pnpm --filter wow-integration-test test

  typescript-contract-gate:
    name: typescript-contract-gate
    needs: [scope, v10-contract]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
