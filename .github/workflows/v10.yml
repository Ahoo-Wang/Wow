# The V10 modules (documentation/designs/v10/06-modules.md §4) on the v10
# branch, in the V10 build scope (`-Pwow.scope=v10`, settings.gradle.kts), so
# no 9.x module is built. Every pull request to v10 triggers this workflow; the
# scope job (.github/scripts/ci-scope.mjs, `v10`) decides whether the jobs run,
# and `v10-gate` is the merge signal: it passes when they pass or when the
# scope skipped them. The 9.x workflows leave the V10 directories out of their
# paths; v10-nightly.yml (on main) runs them on v10 every night.
name: V10
on:
  pull_request:
    branches: [v10]
  push:
    branches: [v10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: GITHUB_ACTIONS

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      v10: ${{ steps.scope.outputs.v10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  # Compiles every V10 module, runs its unit tests (`:architecture:test` holds
  # the V10 dependency rules) and detekt over them.
  check:
    name: V10 Check
    needs: scope
    if: needs.scope.outputs.v10 == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the V10 modules with coverage
        run: ./gradlew -Pwow.scope=v10 v10Check :code-coverage-report:v10CoverageReport --stacktrace
      # The release rehearsal of the Maven publications (R.1), signed with a
      # throwaway key the check generates (gpg): every V10 release module has
      # its jar, sources, javadoc, POM and metadata, signed, the BOM constrains
      # exactly them, no 9.x module is published, and the deploy jobs'
      # prebuilt publish uploads all of it with its signatures.
      - name: Check the V10 publications
        run: ./gradlew -Pwow.scope=v10 v10PublicationCheck --stacktrace
      - name: Upload V10 coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: v10
          name: v10-check
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/v10CoverageReport/v10CoverageReport.xml

  # The container-backed tests of the V10 backends; the H2 and H6 spikes'
  # suites skip themselves unless their flags are set.
  integration:
    name: V10 Integration Test
    needs: scope
    if: needs.scope.outputs.v10 == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run the V10 integration tests with coverage
        run: ./gradlew -Pwow.scope=v10 v10IntegrationTest :code-coverage-report:v10IntegrationCoverageReport --stacktrace
      - name: Upload V10 integration coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: v10
          name: v10-integration
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/v10IntegrationCoverageReport/v10IntegrationCoverageReport.xml

  # Spike H3 runs the 9.x kernel beside the V10 one (decision D90), so the V10
  # scope leaves it out; the full build compiles its benchmarks here.
  kernel-benchmarks:
    name: Kernel benchmarks compile
    needs: scope
    if: needs.scope.outputs.v10 == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compile the H3 benchmarks
        run: ./gradlew :kernel-benchmarks:compileJmhKotlin --stacktrace

  v10-gate:
    name: v10-gate
    needs: [scope, check, integration, kernel-benchmarks]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
