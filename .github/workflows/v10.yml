# The V10 modules (documentation/designs/v10/06-modules.md §4) on the v10
# branch. Every pull request to v10 triggers this workflow; the scope job
# (.github/scripts/ci-scope.mjs, `v10`) decides whether the jobs run, and
# `v10-gate` is the merge signal: it passes when they pass or when the scope
# skipped them.
name: V10
on:
  pull_request:
    branches: [v10]
  push:
    branches: [v10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: GITHUB_ACTIONS

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      v10: ${{ steps.scope.outputs.v10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every V10 integration test project is in exactly one shard
        run: node .github/scripts/v10-integration-shards.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  # Compiles every V10 module, runs its unit tests (`:architecture:test` holds
  # the V10 dependency rules) and detekt over them.
  check:
    name: V10 Check
    needs: scope
    if: needs.scope.outputs.v10 == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # setup-gradle writes its cache (Gradle's build cache among it) only from the default branch, main, by
          # default; v10's pushes write it here, and pull requests to v10 read it.
          cache-read-only: ${{ github.ref != 'refs/heads/v10' }}
      - name: Check the V10 modules with coverage
        run: ./gradlew :check :code-coverage-report:coverageReport --stacktrace
      # The release rehearsal of the Maven publications (R.1), signed with a
      # throwaway key the check generates (gpg): every V10 release module has
      # its jar, sources, javadoc, POM and metadata, signed, the BOM constrains
      # exactly them, no 9.x module is published, and the deploy jobs'
      # prebuilt publish uploads all of it with its signatures.
      - name: Check the V10 publications
        run: ./gradlew publicationCheck --stacktrace
      - name: Upload V10 coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: v10
          name: v10-check
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/coverageReport/coverageReport.xml

  # The container-backed tests of the V10 modules, in shards that run in parallel, each on a runner and a Docker of
  # its own; the H2 and H6 spikes' suites skip themselves unless their flags are set. Each project of
  # `integrationTestProjects` (build.gradle.kts) is in exactly one shard's `projects`: the scope job checks it
  # (.github/scripts/v10-integration-shards.mjs). The shards are balanced by the tests' measured durations (eShop end
  # to end about 3 minutes, the host's about 1¾, Elasticsearch's 1¼, MongoDB's ¾, the rest under ½ each).
  integration:
    name: V10 Integration Test (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.v10 == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: eshop
            projects: :eshop-e2e :eshop-ordering-server
          - shard: host-platform
            projects: :spring-boot :ops-server :view-store-server :analytics-catalog-server
          - shard: kafka-elasticsearch-clickhouse
            projects: :kafka :elasticsearch :clickhouse :routing-spike
          - shard: mongo-postgres
            projects: :mongo :postgres :migrate-data :lease-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/v10' }}
      - name: Run the V10 integration tests with coverage
        env:
          PROJECTS: ${{ matrix.projects }}
        run: >-
          ./gradlew :integrationTest :code-coverage-report:integrationCoverageReport
          "-Pwow.integration.projects=$PROJECTS" --stacktrace
      - name: Upload V10 integration coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: v10
          name: v10-integration-${{ matrix.shard }}
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          files: ./test/code-coverage-report/build/reports/jacoco/integrationCoverageReport/integrationCoverageReport.xml

  v10-gate:
    name: v10-gate
    needs: [scope, check, integration]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
