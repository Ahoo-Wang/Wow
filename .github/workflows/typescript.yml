# Every pull request triggers this workflow; the scope job decides which jobs
# run, and `typescript-gate` is the single signal for merging.
name: TypeScript
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.scope.outputs.typescript }}
      sdk: ${{ steps.scope.outputs.sdk }}
      docs: ${{ steps.scope.outputs.docs }}
      view-engine: ${{ steps.scope.outputs.viewEngine }}
      package-docs: ${{ steps.scope.outputs.packageDocs }}
      view-engine-docs: ${{ steps.scope.outputs.viewEngineDocs }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Check CI scripts
        run: pnpm test:ci-scripts
      # Build output under typescript/ must never be tracked.
      - name: Reject tracked build output
        run: |
          if git ls-files typescript | grep -E '/(dist|coverage|storybook-static|\.vitest-reports|test-output|node_modules)/'; then
            echo "::error::Build output is tracked; remove it and extend .gitignore"
            exit 1
          fi
      # gradle.properties is the one version source; every package.json follows it.
      - name: Check package versions
        run: node .github/scripts/project-version.mjs check
      # Compatibility markers in typescript/*/src and docs/compat-debt.md agree.
      - name: Check compatibility-debt ledger
        run: node .github/scripts/compat-debt.mjs
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      # Packages import each other through their built dist.
      - name: Build packages for static checks
        run: pnpm build:typescript
      - name: Lint without rewriting files
        run: pnpm lint
      - name: Check package types
        run: pnpm typecheck

  # Every package but view-engine, whose suite runs sharded below.
  unit:
    name: Unit / Node ${{ matrix.node-version }}
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload through OIDC.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm -r --filter './typescript/*' --filter '!wow-integration-test' --filter '!wow-storybook' --filter '!@ahoo-wang/wow-view-engine' build
      - name: Test packages
        run: pnpm -r --filter './typescript/*' --filter '!wow-integration-test' --filter '!wow-storybook' --filter '!@ahoo-wang/wow-view-engine' test
      - name: Upload TypeScript coverage
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: typescript
          name: typescript-unit
          fail_ci_if_error: true
          disable_search: true
          files: ./typescript/wow-client/coverage/coverage-final.json,./typescript/wow-react/coverage/coverage-final.json,./typescript/wow-generator/coverage/coverage-final.json

  # The npm packages as a consumer gets them: publint on the tarballs, types
  # under node16, nodenext and bundler resolution, and a fresh npm project that
  # installs, imports and requires them and runs the bins. Node 22.12.0 is the
  # floor engines.node promises; the release preflight runs the same check.
  package:
    name: Package / Node ${{ matrix.node-version }}
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the published packages
        run: pnpm --filter @ahoo-wang/wow-client --filter @ahoo-wang/wow-react --filter @ahoo-wang/wow-generator build
      - name: Check the packages
        run: node .github/scripts/package-check.mjs

  # View-engine's suite (`vitest run --coverage && pnpm test:type`) split in
  # three: each shard collects its third of the coverage as a blob report, and
  # `view-engine` merges them, holding the thresholds once.
  view-engine-shard:
    name: View engine / Node 24 (${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test shard
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=blob --reporter=default
      - name: Preserve shard report
        uses: actions/upload-artifact@v7
        with:
          name: view-engine-blob-${{ matrix.shard }}
          path: typescript/wow-view-engine/.vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  view-engine:
    name: View engine
    needs: [scope, view-engine-shard]
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload through OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:type checks the package against its built dependencies.
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - uses: actions/download-artifact@v7
        with:
          pattern: view-engine-blob-*
          merge-multiple: true
          path: typescript/wow-view-engine/.vitest-reports
      - name: Merge shards and hold coverage thresholds
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --merge-reports --coverage
      - name: Check types
        working-directory: typescript/wow-view-engine
        run: pnpm test:type
      - name: Upload view-engine coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: typescript
          name: typescript-view-engine
          fail_ci_if_error: true
          disable_search: true
          files: ./typescript/wow-view-engine/coverage/coverage-final.json

  # Node 22 formats dates and numbers with its own ICU; the same assertions,
  # without coverage, in two shards that still finish before Node 24's slowest.
  view-engine-node22:
    name: View engine / Node 22 (${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.view-engine == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test shard
        working-directory: typescript/wow-view-engine
        run: pnpm exec vitest run --coverage.enabled=false --shard=${{ matrix.shard }}/2

  # Markdown alone under typescript/: check its formatting (quality does when
  # it runs) and, for view-engine, run the tests that read it instead of the
  # sharded suite (which runs them when it runs).
  package-docs:
    name: Package docs
    needs: scope
    if: needs.scope.outputs.package-docs == 'true' || needs.scope.outputs.view-engine-docs == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        if: needs.scope.outputs.package-docs == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      - name: Build view-engine dependencies
        if: needs.scope.outputs.view-engine-docs == 'true'
        run: pnpm --filter '@ahoo-wang/wow-view-engine^...' build
      - name: Test view-engine docs
        if: needs.scope.outputs.view-engine-docs == 'true'
        run: pnpm --filter @ahoo-wang/wow-view-engine test:docs

  docs:
    name: Documentation
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site's tests compile the TypeScript samples of its pages and the
      # package READMEs against the built packages.
      - name: Build the packages the samples import
        run: pnpm --filter 'documentation^...' build
      - name: Build VitePress site
        run: pnpm --filter documentation docs:build
      # Storybook lands in dist/storybook after VitePress, as on the deployed
      # site, so the tests below check every story link against its index.json.
      - name: Build Storybook into the site
        run: pnpm --filter documentation storybook:build
      - name: Test built site
        run: node --test documentation/test/*.test.mjs

  # actionlint (with shellcheck) over every workflow: the static checks read
  # only the TypeScript ones, and nothing else reads the release and deploy
  # workflows before they run.
  workflow-lint:
    name: Workflow lint
    needs: scope
    if: needs.scope.outputs.workflows == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color

  typescript-gate:
    name: typescript-gate
    needs:
      [
        scope,
        quality,
        unit,
        package,
        view-engine-shard,
        view-engine,
        view-engine-node22,
        package-docs,
        docs,
        workflow-lint,
      ]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
