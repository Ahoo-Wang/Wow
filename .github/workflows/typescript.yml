# Every pull request triggers this workflow; the scope job decides which jobs
# run, and `typescript-gate` is the single signal for merging.
name: TypeScript
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.scope.outputs.typescript }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-scope.mjs

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Check CI scripts
        run: pnpm test:ci-scripts
      - run: pnpm install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/format-changed.mjs
      - name: Lint without rewriting files
        run: pnpm lint
      - name: Check package types
        run: pnpm typecheck

  unit:
    name: Unit / Node ${{ matrix.node-version }}
    needs: scope
    if: needs.scope.outputs.typescript == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholder until the packages move in: matches no project yet.
      - name: Test TypeScript packages
        run: pnpm test

  docs:
    name: Documentation
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build VitePress site
        run: pnpm --filter documentation docs:build
      - name: Test built site
        run: node --test documentation/test/*.test.mjs

  typescript-gate:
    name: typescript-gate
    needs: [scope, quality, unit, docs]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every scoped job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
