# The type labels (enhancement, bug, performance, documentation, maintenance)
# come from the Conventional Commit title, which the squash commit keeps
# (.github/scripts/title-label.mjs); branch names do not decide them. Only
# dependency bots are recognised by branch: their titles are not Conventional
# Commits.
dependencies:
  - head-branch:
      - '^renovate/'
      - '^dependabot/'

# One area per top-level directory, so every change lands in at least
# one. Only 'area: typescript' feeds the release notes (.github/release.yml).
'area: api':
  - changed-files:
      - any-glob-to-any-file:
          - 'api/**'

'area: core':
  - changed-files:
      - any-glob-to-any-file:
          - 'core/**'

'area: compiler':
  - changed-files:
      - any-glob-to-any-file:
          - 'compiler/**'

'area: query':
  - changed-files:
      - any-glob-to-any-file:
          - 'query/**'
          - 'api/query-api/**'

'area: backends':
  - changed-files:
      - any-glob-to-any-file:
          - 'backends/**'

'area: edge':
  - changed-files:
      - any-glob-to-any-file:
          - 'edge/**'

'area: host':
  - changed-files:
      - any-glob-to-any-file:
          - 'host/**'

'area: extensions':
  - changed-files:
      - any-glob-to-any-file:
          - 'extensions/**'

'area: migration':
  - changed-files:
      - any-glob-to-any-file:
          - 'migration/**'

'area: platform':
  - changed-files:
      - any-glob-to-any-file:
          - 'platform/**'

'area: typescript':
  - changed-files:
      - any-glob-to-any-file:
          - 'typescript/**'

'area: test':
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'

'area: example':
  - changed-files:
      - any-glob-to-any-file:
          - 'example/**'

# Build and CI.
'area: build':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'config/**'
          - 'deploy/**'
          - 'gradle/**'
          - 'bom/**'
          - '*.gradle.kts'
          - 'gradle.properties'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'

'area: documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'documentation/**'

skills:
  - changed-files:
      - any-glob-to-any-file:
          - 'skills/**'
          - 'scripts/**'
