# TEMPORARY (G.1 replaces it with deploy/eshop-basket/): the settings of the basket, whose checkout saga calls the
# ordering's command gateway on its internal port (decision D193), as environment variables. Every key it sets is listed
# here, for G.1 to map onto the keys batch 4 renames (D303). The backend's keys (profiles, the database) are in
# postgres.env and mongo.env, which ga-e2e.yml loads as the ConfigMap eshop-basket-backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-basket-config
  labels:
    app.kubernetes.io/name: eshop-basket
data:
  # the brokers (wow.kafka.bootstrap-servers)
  WOW_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  # the operator created the topics (backends/kafka-topics.yaml, D168)
  WOW_KAFKA_TOPICS_DDL: validate
  # capacity: the log's partitions (wow.log.partitions; 64 in deploy/), fewer leases and polls per node
  WOW_LOG_PARTITIONS: "8"
  # publishes the ledger to ops (wow.ops.publish.enabled; D312 makes it auto)
  WOW_OPS_PUBLISH_ENABLED: "true"
  # wow.ops.publish.interval, for the ops loop's bound
  WOW_OPS_PUBLISH_INTERVAL: 5s
  # wow.subscription.parked.min-backoff: a fault's parked entries retry before the verdict
  WOW_SUBSCRIPTION_PARKED_MINBACKOFF: 20s
  # wow.calls.contexts.eshop-ordering.url, the ordering's internal port behind its headless Service; a map key with a
  # dash has no environment variable form
  SPRING_APPLICATION_JSON: '{"wow":{"calls":{"contexts":{"eshop-ordering":{"url":"http://eshop-ordering-cluster:9093"}}}}}'
  # capacity, so every node fits one runner: the heap within the pod's memory limit, one GC thread, two cores' worth
  # of default pools
  JAVA_OPTS: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:ActiveProcessorCount=2
  # diagnostics: every dropped wait signal, not only the first per origin (logging.level.<logger>)
  LOGGING_LEVEL_ME_AHOO_WOW_HTTP_INTERNAL_HTTPSIGNALSENDER: DEBUG
