# The keys this overlay sets over deploy/eshop-payment/configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-payment-service-config
data:
  # Capacity, so every node fits one runner: the heap within the lowered memory limit (the base sets 75%), one GC
  # thread, two cores' worth of default pools; the log's partitions (64 in deploy/), fewer leases and polls per node.
  JAVA_OPTS: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:ActiveProcessorCount=2
  WOW_LOG_PARTITIONS: "8"
  # Diagnostics (F10): HikariCP's configuration at startup and its pool stats every 30 s, on the postgres arm.
  LOGGING_LEVEL_COM_ZAXXER_HIKARI: DEBUG
  # wow.ops.publish.enabled and wow.ops.publish.interval: the ledger reaches ops within the ops loop's bound.
  WOW_OPS_PUBLISH_ENABLED: "true"
  WOW_OPS_PUBLISH_INTERVAL: 5s
  # wow.subscription.parked.initial-backoff: a fault's parked entries retry before the verdict.
  WOW_SUBSCRIPTION_PARKED_INITIALBACKOFF: 20s
  # eshop.payment.gateway.outage-file: the ops loop creates it in every payment pod to fail the charges.
  ESHOP_PAYMENT_GATEWAY_OUTAGEFILE: /tmp/gateway.down
  # wow.subscriptions.[PaymentGatewaySaga.onPaymentRequested].parked.max-retries=0: a failed charge waits for an
  # operator. A map key with a dash has no environment variable form.
  SPRING_APPLICATION_JSON: '{"wow":{"subscriptions":{"[PaymentGatewaySaga.onPaymentRequested]":{"parked":{"max-retries":0}}}}}'
  # The OpenTelemetry Java agent (F6, kustomization.yaml) with no collector: Micrometer's meters, Wow's among them,
  # on its Prometheus endpoint (:9464), which the runner reads; no traces or logs exported, no other instrumentation.
  OTEL_METRICS_EXPORTER: prometheus
  OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
  OTEL_TRACES_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "false"
  OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
