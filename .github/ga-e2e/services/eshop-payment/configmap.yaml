# TEMPORARY (G.1 replaces it with deploy/eshop-payment/): the settings of the payment, with its simulated gateway; it
# takes the ledger's commands from ops on its command topic, as environment variables. Every key it sets is listed here,
# for G.1 to map onto the keys batch 4 renames (D303). The backend's keys (profiles, the database) are in postgres.env
# and mongo.env, which ga-e2e.yml loads as the ConfigMap eshop-payment-backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-payment-config
  labels:
    app.kubernetes.io/name: eshop-payment
data:
  # the brokers (wow.kafka.bootstrap-servers)
  WOW_KAFKA_BOOTSTRAPSERVERS: kafka:9092
  # the operator created the topics (backends/kafka-topics.yaml, D168)
  WOW_KAFKA_TOPICS_DDL: validate
  # wow.kafka.command-intake: ops' resume arrives on wow.eshop-payment.commands (the payment's kafka profile leaves it
  # off)
  WOW_KAFKA_COMMANDINTAKE: "true"
  # capacity: the log's partitions (64 in deploy/); wow.eshop-payment.commands has as many
  WOW_LOG_PARTITIONS: "8"
  # publishes the ledger to ops (wow.ops.publish.enabled; D312 makes it auto)
  WOW_OPS_PUBLISH_ENABLED: "true"
  # wow.ops.publish.interval, for the ops loop's bound
  WOW_OPS_PUBLISH_INTERVAL: 5s
  # wow.subscription.parked.min-backoff: a fault's parked entries retry before the verdict
  WOW_SUBSCRIPTION_PARKED_MINBACKOFF: 20s
  # eshop.payment.gateway.outage-file: the ops loop creates it in every payment pod to fail the charges
  ESHOP_PAYMENT_GATEWAY_OUTAGEFILE: /tmp/gateway.down
  # wow.subscriptions.[PaymentGatewaySaga.onPaymentRequested].parked.max-retries=0: a failed charge waits for an
  # operator
  SPRING_APPLICATION_JSON: '{"wow":{"subscriptions":{"[PaymentGatewaySaga.onPaymentRequested]":{"parked":{"max-retries":0}}}}}'
  # capacity, so every node fits one runner: the heap within the pod's memory limit, one GC thread, two cores' worth
  # of default pools
  JAVA_OPTS: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:ActiveProcessorCount=2
