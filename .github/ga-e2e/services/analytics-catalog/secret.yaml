# TEMPORARY: the PostgreSQL credentials (spring.datasource.username, .password) and the CoSec and ClickHouse secrets.
apiVersion: v1
kind: Secret
metadata:
  name: analytics-catalog-secret
  labels:
    app.kubernetes.io/name: analytics-catalog
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  # cosec.jwt.secret: the service verifies the gateway's tokens itself until S.1c; the gateway's secret.
  COSEC_JWT_SECRET: ga-e2e-not-a-secret-only-for-the-kind-cluster-0123456789
  WOW_CLICKHOUSE_PASSWORD: wow
