# deploy/eshop-catalog as it is, on MongoDB on the mongo arm (postgres/eshop-catalog on the other), with the settings the GA scenarios need on top (config.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deploy/eshop-catalog
patches:
  - path: config.yaml
  # The requests are lowered so every node and backend fits one GitHub runner, and the startup gets five minutes on
  # its shared four cores.
  - target:
      kind: Deployment
      name: eshop-catalog-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 60
