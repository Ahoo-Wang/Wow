# The node advertises its pod's address (finding F9): deploy/eshop-ordering advertises
# $(POD_NAME).eshop-ordering-cluster.$(POD_NAMESPACE).svc.cluster.local, but a Deployment's pods have no spec.hostname, so the
# headless Service publishes no record of that name and the node's peers cannot reach it (forwards, wait signals).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-ordering
spec:
  template:
    spec:
      containers:
        - name: eshop-ordering
          env:
            - name: WOW_NODE_ADDRESS
              value: $(POD_IP):9093
