# deploy/ops as it is, on PostgreSQL in both arms (the platform services have no MongoDB profile), with the settings the GA scenarios need on top (config.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deploy/ops
patches:
  - path: config.yaml
  # The requests are lowered so every node and backend fits one GitHub runner, and the startup gets five minutes on
  # its shared four cores.
  - target:
      kind: Deployment
      name: ops-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            memory: 640Mi
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 60
