# PostgreSQL for both arms: the platform services (ops, view store, analytics catalog) always, the eShop's five
# services on the postgres arm. One database per service, as each deploy/ ConfigMap expects (postgres:5432/<database>).
# max_connections covers every node's pool (HikariCP's 10) with room for the runner's reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  databases.sql: |
    CREATE DATABASE eshop_catalog;
    CREATE DATABASE eshop_basket;
    CREATE DATABASE eshop_ordering;
    CREATE DATABASE eshop_inventory;
    CREATE DATABASE eshop_payment;
    CREATE DATABASE wow_ops;
    CREATE DATABASE view_store;
    CREATE DATABASE analytics_catalog;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["-c", "max_connections=400", "-c", "shared_buffers=256MB"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# The runner's read access (kind.yaml maps the node port to the runner's localhost:30432). Never part of a deployment.
apiVersion: v1
kind: Service
metadata:
  name: postgres-runner
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
