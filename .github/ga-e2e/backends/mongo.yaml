# The mongo arm: a replica set of three members, as operate/mongodb.md describes it
# (mongodb://mongo-0.mongo,mongo-1.mongo,mongo-2.mongo/?replicaSet=rs0). mongo-init (below) initiates it once the
# members answer; the step-down scenario asks the primary to step down (rs.stepDown) and records how long the
# services' writes were refused.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
---
# The members' stable names, mongo-<n>.mongo, for the replica set's configuration and the connection string.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          command: ["mongosh", "--host", "mongo-0.mongo:27017", "--quiet", "--eval"]
          args:
            - |
              try {
                rs.status();
                print("already initiated");
              } catch (e) {
                rs.initiate({_id: "rs0", members: [
                  {_id: 0, host: "mongo-0.mongo:27017"},
                  {_id: 1, host: "mongo-1.mongo:27017"},
                  {_id: 2, host: "mongo-2.mongo:27017"}]});
              }
              let tries = 0;
              while (!db.hello().isWritablePrimary && !rs.status().members.some(m => m.stateStr === "PRIMARY")) {
                if (++tries > 120) throw new Error("no primary elected");
                sleep(1000);
              }
              printjson(rs.status().members.map(m => [m.name, m.stateStr]));
