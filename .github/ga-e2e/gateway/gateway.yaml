# CoSec Gateway in front of every public port: it verifies each request's CoSec token (Authorization: Bearer, HMAC256
# with COSEC_JWT_SECRET), decides the request with its documents in Redis (documents/, which cluster.sh publishes
# before the gateway starts), and forwards the principal it verified in the CoSec-Identity header, without the token;
# every service behind it reads its callers from that header in CoSec's gateway mode, with no secret, documents or
# Redis of its own. It routes by the context prefix. It writes the TCP peer it accepted as the one X-Forwarded-For
# (trusted-proxies, for-append: false), never believing a client's (forward-headers-strategy: none), so a service's
# remote_ip is the client's. Its pods carry app.kubernetes.io/component: gateway, which every service's public
# NetworkPolicy admits: a service believes any CoSec-Identity, so nothing else may reach it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosec-gateway-config
data:
  # The image reads its configuration from this directory alone (spring.config.location=file:./config/).
  application.yaml: |
    # region settings
    server:
      port: 8080
      # The gateway is the edge: it never takes a client's Forwarded or X-Forwarded-For as its remote address. Spring
      # Boot defaults to the native strategy on Kubernetes, which would (run 7 recorded the claimed 203.0.113.9).
      forward-headers-strategy: none
    spring:
      data:
        redis:
          host: redis
          port: 6379
      cloud:
        gateway:
          server:
            webflux:
              # The X-Forwarded headers filter writes X-Forwarded-* only for a peer trusted-proxies matches (Spring Cloud
              # Gateway 4.1+); unset, it writes none and the service sees the gateway's own address. Every peer matches:
              # the gateway is the edge, its peer is the client (server.forward-headers-strategy: none above), and
              # for-append: false writes that peer as the one X-Forwarded-For, whatever the client sent.
              trusted-proxies: ".*"
              x-forwarded:
                for-append: false
              # Only X-Forwarded-For carries the client's address on: a Forwarded header the services would prefer over
              # it is not sent.
              forwarded:
                enabled: false
              # Connections to a service's pods idle at most 15 s: a pod that died stays in the endpoints a little
              # while, and a pooled connection to it answers a reset; shorter than that, a stale one is rare.
              httpclient:
                pool:
                  max-idle-time: 15s
              # Every route retries a request once when its connection fails (reset, refused, timed out), POST
              # included: Wow deduplicates a command by its request id, the client's Wow-Request-Id or else the
              # CoSec-Request-Id the gateway sets once per exchange, and a retry carries the same one
              # (the "a resent request keeps its request id" scenario, through the flaky upstream below). A response is
              # an answer and never retried (series INFORMATIONAL: no final status matches).
              default-filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET,POST,PUT,PATCH,DELETE
                    series: INFORMATIONAL
                    exceptions: java.io.IOException,java.util.concurrent.TimeoutException
              # endregion
              # region routes
              # Each service by its context prefix. A route takes the CoSec-Identity of a permitted request only when
              # it opts in (metadata cosec-identity: true) or targets lb://: these target a Kubernetes Service's URL.
              routes:
                - id: eshop-catalog
                  uri: http://eshop-catalog-service
                  predicates: [Path=/eshop-catalog/**]
                  metadata: { cosec-identity: true }
                - id: eshop-basket
                  uri: http://eshop-basket-service
                  predicates: [Path=/eshop-basket/**]
                  metadata: { cosec-identity: true }
                # endregion
                - id: eshop-ordering
                  uri: http://eshop-ordering-service
                  predicates: ["Path=/eshop-ordering/**,/wow/dataset/eshop-ordering/**"]
                  metadata: { cosec-identity: true }
                - id: eshop-inventory
                  uri: http://eshop-inventory-service
                  predicates: [Path=/eshop-inventory/**]
                  metadata: { cosec-identity: true }
                - id: eshop-payment
                  uri: http://eshop-payment-service
                  predicates: [Path=/eshop-payment/**]
                  metadata: { cosec-identity: true }
                - id: ops
                  uri: http://ops-service
                  predicates: [Path=/ops/**]
                  metadata: { cosec-identity: true }
                - id: view-store
                  uri: http://view-store-service
                  predicates: [Path=/view-store/**]
                  metadata: { cosec-identity: true }
                - id: analytics-catalog
                  uri: http://analytics-catalog-service
                  predicates: [Path=/analytics-catalog/**]
                  metadata: { cosec-identity: true }
                # The runner's upstream that resets each probe's first connection after reading its request
                # (flaky.yaml): the evidence of what a retry resends. Not a service; the E2E's alone.
                - id: ga-e2e-flaky
                  uri: http://flaky
                  predicates: [Path=/ga-e2e-flaky/**]
    # region cosec
    cosec:
      audit:
        kafka:
          enabled: false
      authentication:
        login:
          enabled: false
      ip2region:
        enabled: false
      jwt:
        algorithm: hmac256
        secret: ${COSEC_JWT_SECRET}
      authorization:
        # The gateway is the edge: environment.ip is the TCP peer, never an X-Forwarded-For entry.
        remote-ip:
          max-trusted-index: 0
        snapshot:
          # Ready once the shop's tenant document is installed too, not the platform document alone.
          prewarm-tenants: ["(0)"]
      # What a service behind it reads: the identity alone (tenant, principal, app, space, roles, the token's id and
      # expiry), no token claims and no Authorization header, since no service verifies a token.
      gateway:
        identity:
          forward-authorization: false
      # endregion
    logging:
      level:
        root: info
    management:
      endpoint:
        health:
          # /actuator/health/liveness and /readiness for the probes; readiness refuses traffic until the platform
          # document and the prewarmed tenant's are installed.
          probes:
            enabled: true
---
apiVersion: v1
kind: Secret
metadata:
  name: cosec-jwt
type: Opaque
stringData:
  # The gateway's alone, with which the runner signs its callers' tokens: no service behind it verifies one.
  COSEC_JWT_SECRET: ga-e2e-not-a-secret-only-for-the-kind-cluster-0123456789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosec-gateway
  labels:
    app.kubernetes.io/name: cosec-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cosec-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosec-gateway
        app.kubernetes.io/component: gateway
      annotations:
        ga-e2e/config: "1"
    spec:
      containers:
        - name: cosec-gateway
          image: ghcr.io/ahoo-wang/cosec-gateway:8.0.0-alpha.1@sha256:2441f9f36b8a1174cfed0711f7811b1bab40779bbe14514dca3b9727aaf1e045
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cosec-jwt
          env:
            # The image's start script sets -Xms2048M -Xmx2048M and 512M of direct memory; JAVA_OPTS comes after it
            # and wins.
            - name: JAVA_OPTS
              value: -Xms256m -Xmx384m -XX:MaxDirectMemorySize=192m -Djava.net.preferIPv4Stack=true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /opt/cosec-gateway-server/config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: cosec-gateway-config
---
# The clients' way in: kind.yaml maps the node port to the runner's localhost:30080.
apiVersion: v1
kind: Service
metadata:
  name: cosec-gateway
  labels:
    app.kubernetes.io/name: cosec-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cosec-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
