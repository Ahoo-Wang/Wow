[versions]
# libraries
spring-boot = "4.2.0"
cosid = "5.1.0"
cocache = "8.2.0"
# The train of Spring Boot 4.2.x (spring-cloud-commons 5.1.x; 2025.1 is the 4.0.x and 4.1.x train), for wow-spring-cloud (D396)
spring-cloud = "2026.0.0"
cosec = "8.0.0"
# The worked example of wow-spring-cloud's registry (D396, D461), on its integration test class path only
cosky = "8.0.0-rc.3"
testcontainers = "2.0.5"
opentelemetry = "1.68.0"
opentelemetry-instrumentation = "2.34.0"
guava = "33.7.2-jre"
kotlin-logging = "8.0.7"
springdoc = "3.2.1"
jsonschema-generator = "5.0.0"
json-schema-validator = "3.0.9"
kotlinx-coroutines = "1.11.0"
# ClickHouse
clickhouse-java = "0.11.2"
# kafka-clients' compression codecs, at their patched versions until kafka-clients brings them (backends/kafka)
snappy-java = "1.1.10.12"
lz4-java = "1.11.4"
# testing
junit = "6.1.3"
fluent-assert = "1.3.1"
mockk = "1.14.12"
asm = "9.11.1"
kotlin-compile-testing = "0.14.0"
# plugins
test-retry = "1.6.6"
detekt = "1.23.8"
dokka = "2.3.0"
kotlin = "2.4.21"
ksp = "2.3.14"
publish-plugin = "2.0.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
cosid-bom = { module = "me.ahoo.cosid:cosid-bom", version.ref = "cosid" }
cocache-bom = { module = "me.ahoo.cocache:cocache-bom", version.ref = "cocache" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
cocache-spring-boot-starter = { module = "me.ahoo.cocache:cocache-spring-boot-starter", version.ref = "cocache" }
cosec-webflux = { module = "me.ahoo.cosec:cosec-webflux", version.ref = "cosec" }
cosec-spring-boot = { module = "me.ahoo.cosec:cosec-spring-boot", version.ref = "cosec" }
cosec-testkit = { module = "me.ahoo.cosec:cosec-testkit", version.ref = "cosec" }
cosky-spring-boot-starter = { module = "me.ahoo.cosky:cosky-spring-boot-starter", version.ref = "cosky" }
jsonschema-generator-bom = { module = "com.github.victools:jsonschema-generator-bom", version.ref = "jsonschema-generator" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version.ref = "opentelemetry-instrumentation" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-symbol-processing = { module = "com.google.devtools.ksp:symbol-processing", version.ref = "ksp" }
ksp-symbol-processing-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
ksp-symbol-processing-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
kotlin-compile-testing = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kotlin-compile-testing" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
springdoc-bom = { module = "org.springdoc:springdoc-openapi-bom", version.ref = "springdoc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
clickhouse-client-v2 = { module = "com.clickhouse:client-v2", version.ref = "clickhouse-java" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
fluent-assert-bom = { module = "me.ahoo.test:fluent-assert-bom", version.ref = "fluent-assert" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
[plugins]
test-retry = { id = "org.gradle.test-retry", version.ref = "test-retry" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "publish-plugin" }
