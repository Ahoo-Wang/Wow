spring:
  application:
    name: eshop-catalog-service
server:
  port: 8081
wow:
  # One node, its data in memory: the default, for trying the catalog out, its snapshot queries served from memory too.
  # The `mongo` profile below serves the catalog, and its queries, from MongoDB, the `postgres` profile from
  # PostgreSQL.
  internal:
    port: 9091
# CoSec runs behind the CoSec gateway alone (the `cosec` profile below); without it, a node in a development profile
# (`dev`, which `./gradlew run` adds) takes its callers from the Wow-* identity headers (the host's development callers),
# one in development by its loopback internal port alone serves every request as the anonymous caller, and any other
# node does not start (decision D301).
wow.cosec.mode: "off"
---
# On this machine alone, for trying the shop out, where Spring Boot detects no cloud platform: the internal port binds
# the loopback interface. On Kubernetes this document does not apply, and a deployment binds the pod's address
# (WOW_INTERNAL_HOST).
spring:
  config:
    activate:
      on-cloud-platform: none
wow:
  internal:
    host: 127.0.0.1
---
# region mongo
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the service's data in a
# database of its own.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  mongo:
    database: eshop_catalog
# endregion
---
# region search
# MongoDB with the products' search on Elasticsearch (Operate › Elasticsearch), instead of the mongo profile: its stores
# are named. The log, the commands' loads and the state reads are on MongoDB, the store main;
# Elasticsearch holds a copy of the products' snapshots and their events, which the host writes after each commit, and
# serves the product's snapshot and events queries. It is not on the commands' path: while it is down, the catalog
# takes its commands and serves its states, and its queries answer again once it is back and caught up.
spring:
  config:
    activate:
      on-profile: search
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
  elasticsearch:
    uris: http://localhost:9200
wow:
  stores:
    main:
      type: mongo
      database: eshop_catalog
    search:
      type: elasticsearch
      options:
        index-prefix: eshop
  log:
    store: main
  aggregates:
    "[eshop-catalog.product]":
      snapshot:
        stores: [main, search]
      query:
        snapshot:
          store: search
        events:
          store: search
# endregion
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_catalog
    username: postgres
    password: postgres
---
# region cosec
# Behind the CoSec gateway (decisions D295, D296): the gateway verifies each request's CoSec token (Authorization:
# Bearer) and forwards it; CoSec's inject mode here reads the principal from it, with no secret, and wow-cosec's
# resolver makes it the caller (decision D301): its tenant, its id, its roles. Only the gateway may reach the public
# port (the deployment's NetworkPolicy). CoSec does not authorize the paths itself: what a caller may do is the
# service's to say.
spring:
  config:
    activate:
      on-profile: cosec
wow:
  cosec:
    mode: gateway
    # An employee is a tenant-level caller (decision D189): no owner, so it reaches every aggregate of the tenant. Any
    # other principal is a buyer, an owner-level caller that reaches its own.
    tenant-level:
      roles: employee
# endregion
