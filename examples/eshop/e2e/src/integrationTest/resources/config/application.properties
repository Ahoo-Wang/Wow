# The services this JVM runs on one class path (wowServer) read one application.yaml, perhaps another service's: the
# CoCache that the ordering and payment servers bring runs in memory here, so no service looks for a Redis. The
# services in JVMs of their own read their own configuration; EshopPaymentFlowTest runs those on Redis.
cocache.backend=memory
management.health.redis.enabled=false
