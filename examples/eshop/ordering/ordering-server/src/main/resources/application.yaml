spring:
  application:
    name: eshop-ordering-service
  config:
    # The order numbers: CosId's stores and generators.
    import: classpath:eshop-ordering-ids.yaml
server:
  port: 8083
# region internal-port
wow:
  # One node, its data in memory, for trying the service out. The `mongo` profile serves it from MongoDB, the `postgres`
  # profile from PostgreSQL; the `kafka` profile connects it to the other contexts; without it, the node on this machine
  # keeps its topics in its JVM (wow.transport), where the inventory does not see the commands its sagas send.
  internal:
    port: 9093
  # The basket service's checkout calls this command gateway synchronously, on the internal port
  # alone, naming itself (Wow-Service): the internal port is reachable by the shop's own pods alone,
  # so a service that names itself is taken on that network's word, and may name the buyer the order is for.
  callers:
    eshop-basket-service:
      # The commands the basket may call, a list that catches a misconfiguration: its checkout
      # submits the order, and nothing else. A system command (wow.*: delete, restore, transfers, tags) is never
      # called unless listed here.
      commands:
        - eshop-ordering.order.SubmitOrder
# endregion
eshop:
  ordering:
    # How long an order whose stock is confirmed waits for its payment before it cancels itself.
    payment-grace-period: 30m
# CoSec runs behind the CoSec gateway alone (the `cosec` profile below); without it, a node in a development profile
# (`dev`, which `./gradlew run` adds) takes its callers from the Wow-* identity headers (the host's development callers),
# one in development by its loopback internal port alone serves every request as the anonymous caller, and any other
# node does not start (decision D301).
wow.cosec.mode: disabled
# CoCache shares the orders on Redis in the `redis` profile below alone: without it, the node runs no cache and checks
# no Redis health.
cocache:
  enabled: false
management.health.redis.enabled: false
---
# On this machine alone, for trying the shop out, where Spring Boot detects no cloud platform: the internal port binds
# the loopback interface. On Kubernetes this document does not apply, and a deployment binds the pod's address
# (WOW_INTERNAL_HOST).
spring:
  config:
    activate:
      on-cloud-platform: none
wow:
  internal:
    host: 127.0.0.1
---
# region mongo
# MongoDB, a replica set: the host creates the client from the URI (decision D318) and keeps the service's data in a
# database of its own.
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: mongodb://localhost:27017/?replicaSet=rs0
wow:
  mongo:
    database: eshop_ordering
# endregion
---
# region postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/eshop_ordering
    username: postgres
    password: postgres
# endregion
---
spring:
  config:
    activate:
      on-profile: kafka
# region kafka
wow:
  kafka:
    bootstrap-servers: localhost:9092
    # Execute the commands other contexts send to wow.eshop-ordering.commands (the payment's), which has as many
    # partitions as the context's log (wow.log.partitions, 64 by default).
    command-intake:
      enabled: true
# endregion
---
# region clickhouse
spring:
  config:
    activate:
      on-profile: clickhouse
wow:
  clickhouse:
    # The order stream is written to ClickHouse by the Sink (eshop_ordering_order_state_flat, ...), and the sales
    # dataset, META-INF/wow/dataset/eshop-ordering.sales.json, is queried there: /wow/dataset/eshop-ordering/sales/query.
    endpoint: http://localhost:8123
    sink:
      enabled: true
# endregion
---
# region redis
# The orders shared through CoCache (wow-cocache): after each commit the node writes the order into the cache, at its
# version, and the payment service reads it there (its `redis` profile) as `StateViewCache<OrderStateView>`.
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: localhost
      port: 6379
cocache:
  enabled: true
  backend: redis
wow:
  cocache:
    publish:
      - eshop-ordering.order
management.health.redis.enabled: true
# endregion
---
# region cosec
# Behind the CoSec gateway: the gateway verifies each request's CoSec token, decides the request with its documents and
# forwards the principal it verified in the CoSec-Identity header; CoSec's gateway mode here reads that header, with no
# secret, documents or Redis of its own, and wow-cosec's resolver makes it the caller: its tenant, its id, its roles. A
# request without the header is anonymous. The service believes any CoSec-Identity, so only the gateway may reach the
# public port (the deployment's NetworkPolicy). What a caller may do with an aggregate is the service's to say.
spring:
  config:
    activate:
      on-profile: cosec
wow:
  cosec:
    mode: gateway
    # An employee is a tenant-level caller: no owner, so it reaches every aggregate of the tenant. Any
    # other principal is a buyer, an owner-level caller that reaches its own.
    tenant-level:
      roles: employee
# endregion
